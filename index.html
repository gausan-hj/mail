        'ஆனால், காலம் மெதுவாகக் கடந்தபோது, நாங்களும் மாறத் தொடங்கிவிட்டோம்.',
        'படிவம் 2-க்கு வந்தபோது, நாங்கள் படிப்படியாக “சின்னத் தேவதைகளிலிருந்து” “குறும்புப் பிசாசுகளாக” மாறினோம். வகுப்பின்போது திடீரென்று வெளிவரும் விசித்திரமான கருத்துகள், ஆசிரியர்களைச் சிரிப்பதா அழுவதா என்று தெரியாமல் செய்யும் செயல்கள், தொடர்ந்து நிகழ்ந்துகொண்டிருந்த பல்வேறு சிறு சம்பவங்கள்—இவை அனைத்தும் எங்கள் வகுப்பை நாளுக்கு நாள் இன்னும் கலகலப்பாக மாற்றின. படிவம் 3-க்கு வந்தபோது, நாங்கள் முற்றிலும் கட்டுப்பாடின்றி நடந்துகொள்ளத் தொடங்கிவிட்டோம். படிவம் 1-இல் சேர்த்துவைத்திருந்த எங்கள் உற்சாகத்தையும் குறும்புத்தனத்தையும் ஒரே நேரத்தில் வெளியேற்றிவிட்டதுபோல் இருந்தது. வகுப்பில் சாப்பிடுவது, உரக்கக் கூச்சலிடுவது, சத்தம் போடுவது என்று சில நேரங்களில் எங்கள் வகுப்பறையே சுன் வுகோங் சொர்க்கத்தில் கலகம் செய்ததைப் போல இருந்தது. இப்போது நினைத்துப் பார்க்கும்போது, நாளுக்கு நாள் இன்னும் குறும்புக்காரர்களாக மாறிய எங்களை மூன்று ஆண்டுகள் பொறுமையுடன் வழிநடத்திய ஆசிரியர்களை உண்மையிலேயே வியக்காமல் இருக்க முடியவில்லை.',
        'இந்த மூன்று ஆண்டுகளில் பலர் வந்தார்கள், பலர் சென்றார்கள். எங்களைச் சுற்றியிருந்த முகங்கள் தொடர்ந்து மாறிக்கொண்டே இருந்தன. ஆனால், எங்கள் வகுப்புக்குச் சொந்தமான கதைகள் மட்டும் ஒருபோதும் நின்றுவிடவில்லை. புதிய மாணவர்கள் எங்கள் வகுப்பில் சேர்ந்தார்கள்; சில மாணவர்கள் எங்களை விட்டுச் சென்றார்கள். புதிய ஆசிரியர்கள் எங்கள் வகுப்பறைக்குள் வந்தார்கள்; முன்பு எங்களுக்குக் கற்பித்த சில ஆசிரியர்கள் பள்ளியைவிட்டுச் சென்றார்கள். சில ஆசிரியர்கள் பின்னர் எங்களுடன் வகுப்பில் இல்லாமல் போனாலும், சில முகங்கள் படிப்படியாக நினைவுகளில் மட்டுமே தங்கிவிட்டாலும், நீங்கள் எங்களுக்குக் கற்பித்தீர்கள் என்ற உண்மை காலம் கடந்ததால் மாறிவிடாது. எங்களுடன் நீங்கள் இருந்த காலம் நீண்டதாக இருந்தாலும் குறுகியதாக இருந்தாலும், நீங்கள் எங்கள் இடைநிலைப் பள்ளி வாழ்க்கையின் ஒரு பகுதியாகிவிட்டீர்கள்.',
        'எங்கள் வகுப்பின் நினைவுகளைப் பற்றிப் பேசத் தொடங்கினால், சொல்லிக்கொண்டே இருக்கக்கூடிய எண்ணற்ற சம்பவங்கள் இருக்கின்றன.',
        'படிவம் 1 முதல் படிவம் 2 வரை, ஒரு பெண் மாணவி எப்போதும் ஒரே வார்த்தைகளைத் திரும்பத் திரும்பச் சொல்வது நினைவிருக்கிறதா? “ஆசிரியரே, எனக்குக் கோழிக்கால் சாப்பிட வேண்டும்! ஆசிரியரே, எனக்குக் கோழிக்கால் சாப்பிட வேண்டும்!” என்று அவர் அடிக்கடி கூறுவார். இப்போது நினைத்துப் பார்த்தால், அந்த வாக்கியம் எங்கள் வகுப்பின் தனித்துவமான நினைவுகளில் ஒன்றாகவே மாறிவிட்டது. அப்போது அது சாதாரணமாகச் சொல்லப்பட்ட ஒரு வார்த்தையாக மட்டுமே இருந்திருக்கலாம். ஆனால், அன்றாட வாழ்க்கையில் நடந்த இப்படிப்பட்ட சாதாரணமான, சில நேரங்களில் காரணமே புரியாத சிறிய சம்பவங்கள்தான் எங்கள் பள்ளி வாழ்க்கையை இவ்வளவு சுவாரஸ்யமாக மாற்றின.',
        'எங்கள் தொண்டு விற்பனை நிகழ்ச்சியும் நினைவிருக்கிறது. அந்த நிகழ்ச்சிக்காக அனைவரும் நிறையத் தயாரிப்புகளைச் செய்தோம். அந்தக் காலத்தில், ஒரே இலக்கை அடைவதற்காக நாங்கள் அனைவரும் ஒன்றாகப் பணிகளில் ஈடுபட்டோம்; வகுப்பிற்குச் சொந்தமான பொறுப்புகளையும் ஒன்றாக நிறைவேற்றினோம். இன்று திரும்பிப் பார்க்கும்போது, அந்தத் தொண்டு விற்பனை நிகழ்ச்சி வெறும் ஒரு நிகழ்ச்சி மட்டுமல்ல. நாங்கள் ஒன்றாக முயற்சி செய்து, ஒன்றாக ஒத்துழைத்ததற்கான சான்றாகவும் அது இருக்கிறது. அப்போது நாங்கள் செய்ய வேண்டிய வேலையைச் சரியாக முடிப்பதில் மட்டுமே கவனம் செலுத்தியிருக்கலாம். ஆனால், ஒன்றாக அனுபவித்த அந்தத் தருணங்கள் எதிர்காலத்தில் நினைத்துப் பார்க்கத் தகுந்த இளமைக்கால நினைவுகளாக மாறும் என்பதை அப்போது உணரவில்லை.',
        'நிச்சயமாக, எங்கள் வகுப்பில் ஒவ்வொரு நாளும் இவ்வளவு ஒழுங்காக இருக்கவில்லை.',
        'படிவம் 2-இல் நடந்த வரலாற்றுப் பாடத்தின்போது, எங்களில் ஒருவர் வரலாற்று ஆசிரியரைக் கோபப்படுத்தி, அவர் அங்கேயே கோபமடைந்த சம்பவம் நடந்தது. இப்போது திரும்பிப் பார்க்கும்போது, சில நேரங்களில் நாங்கள் உண்மையிலேயே அளவுக்கு அதிகமாகக் குறும்பு செய்தோம் என்பதை ஒப்புக்கொள்ள வேண்டும். எங்களுடைய மகிழ்ச்சியில் மட்டுமே கவனம் செலுத்தி, ஆசிரியர்களும் வகுப்பறையின் ஒழுங்கைப் பராமரிக்க வேண்டியிருக்கிறது என்பதையும் அவர்களுக்கும் சொந்தமான உணர்வுகள் இருக்கின்றன என்பதையும் மறந்துவிட்டோம். இருந்தாலும், நாங்கள் சில நேரங்களில் வரலாற்று ஆசிரியருக்குத் தலைவலியாக இருந்தபோதும், ஆசிரியர் மீண்டும் மீண்டும் எங்களைப் பொறுத்துக்கொண்டு பொறுமையாகக் கற்பித்தார். எங்கள் குறும்புத்தனத்தைக் காரணமாகக் கொண்டு எங்களை அவ்வளவு எளிதில் கைவிடாததற்கு நன்றி. கோபமடைந்த பிறகும் தொடர்ந்து எங்களுக்குக் கற்பிக்கத் தயாராக இருந்ததற்கும் நன்றி.',
        'படிவம் 3-க்கு வந்தபோது, எங்கள் குறும்புத்தனம் இன்னும் ஒரு நிலை உயர்ந்துவிட்டது போல இருந்தது.',
        'இடைவேளை மணி அடித்தவுடன், எங்கள் வகுப்பறை வேறொரு உலகமாக மாறிவிடும். நாங்கள் அனைவரும் தன்னிச்சையாக ஆசிரியரின் மேசையைச் சுற்றிக் கூடிவிடுவோம். ஒருவர் பின் ஒருவராக அங்கே வந்து நிற்பார்கள்; சிலர் உட்காருவார்கள், சிலர் உணவுப் பொருட்களை எடுத்துவருவார்கள். இப்படியே அனைவரும் ஒன்றாக அமர்ந்து சாப்பிடுவோம், பேசுவோம், சிரித்துக்கொண்டே அரட்டை அடிப்போம். ஆசிரியர் அங்கே இல்லாவிட்டாலும், ஆசிரியரின் மேசையைச் சுற்றி அமர்ந்திருப்பவர்கள் நாங்கள்தான். சில நேரங்களில் ஆசிரியரின் மேசையின் மேலேயே உணவையும் வைத்துச் சாப்பிட்டோம்.',
        'தொலைவிலிருந்து பார்த்தால், ஏதோ முக்கியமான பெரிய கூட்டம் நடப்பதைப் போலவே தோன்றும். ஒவ்வொருவரும் தங்களுக்குச் சொந்தமான கருத்துகளைச் சொல்ல வேண்டியவர்களைப் போலவும், தங்களுக்குச் சொந்தமான விஷயங்களை விவாதிக்க வேண்டியவர்களைப் போலவும் இருப்பார்கள். அனைவரும் ஒன்றாகக் கூடி, மிகவும் கலகலப்பாக இருப்போம். உண்மையில் அது வெறும் இடைவேளை நேரம் மட்டுமே. ஒன்றாகச் சாப்பிடுவதற்காகக் கூடியிருந்தோம். ஆனால், முழு வகுப்பின் பிரதிநிதிகளும் ஒன்றுகூடி முக்கியமான விஷயங்களை விவாதிப்பதைப் போன்ற தோற்றத்தை நாங்கள் உருவாக்கிவிட்டோம்.',
        'இதனால்தான் எங்கள் வகுப்புக்கு “ஐக்கிய நாடுகள் சபை” என்ற பெயர் வந்தது. படிவம் 3-க்கு வந்தபோது, மற்ற வகுப்புகளைச் சேர்ந்த பல மாணவர்களும் நேரடியாக எங்கள் வகுப்பறைக்குள் வந்து இந்தக் கலகலப்பான “கூட்டத்தில்” இணைந்துகொள்வார்கள். ஆரம்பத்தில் எங்கள் வகுப்புக்குச் சொந்தமான இடமாக இருந்தது, மாணவர்கள் தொடர்ந்து வந்து போனதால் ஒரு சிறிய “ஐக்கிய நாடுகள் சபை” போல மாறிவிட்டது. சில நேரங்களில் அனைவரும் ஆசிரியரின் மேசையைச் சுற்றி அமர்ந்து சாப்பிடுவதையும், பேசுவதையும், குறும்பு செய்வதையும் பார்த்தால், முடிவே இல்லாத ஒரு பெரிய கூட்டம் நடப்பதைப் போலவே இருக்கும்.',
        'ஆசிரியரின் மேசை என்பது முதலில் ஆசிரியர் வகுப்பில் பயன்படுத்துவதற்கான இடமாக இருந்தது. ஆனால் எங்கள் வகுப்பில் அது “ஐக்கிய நாடுகள் சபையின் மாநாட்டு மண்டபமாக” மாறிவிட்டது. நாங்கள் மாணவர்களோ, ஒவ்வொரு நாளும் சரியான நேரத்தில் கூட்டத்திற்கு வருகை தரும் பிரதிநிதிகளாக இருந்தோம். அப்போது இப்படி ஒன்றாகக் கூடி உண்பதும் பேசுவதும் மிகவும் வேடிக்கையாக இருந்தது என்று மட்டுமே நினைத்திருக்கலாம். ஆனால் இன்று நினைத்துப் பார்க்கும்போது, ஒன்றாக அமர்ந்து சாப்பிட்ட, பேசிக் கலகலத்த, குறும்பு செய்த அந்த நேரங்கள்தான் படிவம் 3 வாழ்க்கையின் மிகவும் தெளிவாக நினைவில் நிற்கும் பகுதிகளில் ஒன்றாக மாறிவிட்டன.',
        'படிவம் 2 முதல் படிவம் 3 வரை, மற்ற வகுப்புகளைச் சேர்ந்த மாணவர்கள் எங்கள் வகுப்பிற்கு ஒரு தனிப்பட்ட பெயரையும் வைத்தார்கள்—“மொக்கை நகைச்சுவைகளின் திறந்த மூல மையம்”. இவ்வளவு மொக்கையான நகைச்சுவைகளை யார் வழங்கினார்கள் என்று எங்களுக்கே தெரியவில்லை. ஆனால் இந்தப் பெயர் வெளியே பரவிவிட்டதால், எங்கள் வகுப்பிற்கும் தனக்கென ஒரு “நகைச்சுவைத் திறமை” இருக்கிறது என்று தெரிகிறது.',
        'எங்கள் வகுப்பில் மிகவும் உரத்த குரலில் பேசும் அந்தப் பெண் மாணவியும் நினைவிருக்கிறார். அவர் பேசத் தொடங்கியவுடன், அனைவரின் செவிப்பறைகளையும் உடைத்துவிடும் அளவுக்கு அவரது குரல் மிகவும் அதிகமாக இருக்கும். இப்படிப்பட்ட சம்பவங்கள் நடக்கும் ஒவ்வொரு முறையும், முழு வகுப்பிலும் சிரிப்பதா என்ன செய்வதா என்று தெரியாத தருணங்கள் உருவாகும். இன்று திரும்பிப் பார்க்கும்போது, அந்தச் சத்தமும் கூச்சலும் நிறைந்த காட்சிகள்கூட நாங்கள் பிரிய மனமில்லாத நினைவுகளின் ஒரு பகுதியாகிவிட்டன.',
        'ஒரு வெள்ளிக்கிழமையும் இருக்கிறது. இன்றுவரை அதை நினைத்துப் பார்த்தால், அன்றைய பைத்தியக்காரத்தனமான உற்சாகம் இன்னும் உணரப்படுவது போல இருக்கிறது.',
        'அடுத்த நாள் சனிக்கிழமை என்பதால், இறுதியாக ஓய்வெடுக்க முடியும் என்ற மகிழ்ச்சியில் அனைவரும் பள்ளி முடியும் நேரத்திற்கு முன்பே அளவுக்கு அதிகமாக உற்சாகமடைந்திருந்தோம். வகுப்பறையில் உரக்கக் கத்தினோம்; சிலர் பொருட்களை இங்கும் அங்கும் தூக்கி எறிந்தார்கள். முழு வகுப்பும் குழப்பமாக மாறிவிட்டது. அந்த நேரத்தில், அனைவரும் பள்ளியைவிட்டு வெளியே ஓடி, தங்களுக்கான ஓய்வு நேரத்தை வரவேற்கத் தயாராக இருப்பதைப் போல இருந்தோம். இப்போது நினைத்துப் பார்க்கும்போது, விடுமுறைக்காக நாங்கள் இவ்வளவு அளவுக்கு அதிகமாக உற்சாகமடைய முடிந்ததே என்று தோன்றுகிறது. இப்படிப்பட்ட நாட்களிலும் ஆசிரியர்கள் வகுப்பறையின் ஒழுங்கைப் பராமரிக்க முயற்சி செய்ய வேண்டியிருந்தது. உண்மையிலேயே உங்களுக்கு மிகவும் சிரமமாக இருந்திருக்கும்.',
        'இங்கே வந்தபோது, கணித ஆசிரியருக்கு நாங்கள் குறிப்பாக நன்றி சொல்ல வேண்டும்.',
        'கணித ஆசிரியரே, இத்தனை காலமாக எங்களிடம் பொறுமையுடனும் சகிப்புத்தன்மையுடனும் இருந்ததற்கு நன்றி. ஒவ்வொரு முறையும் நாங்கள் உங்களுக்கு நிம்மதியை அளிக்கும் மாணவர்களாக இருக்கவில்லை என்பதை நாங்கள் அறிவோம். சில நேரங்களில் எங்களால் நீங்கள் ஏற்கெனவே கோபமடைந்திருந்தாலும், தொடர்ந்து மேடையில் நின்று பாடம் நடத்துவீர்கள். கணக்குகளைத் தீவிரமாக விளக்குவீர்கள். நாங்கள் புரிந்துகொண்டு கற்றுக்கொள்ள வேண்டும் என்பதற்காக முயற்சி செய்வீர்கள்.',
        'ஆனால், ஒரு சம்பவம் இருக்கிறது. அதை இன்றுவரை நினைத்துப் பார்க்கும்போது எங்கள் மனதில் சிறிது வருத்தம் ஏற்படுகிறது.',
        'அந்த முறை, ஒரு பெண் மாணவிக்கும் கணித ஆசிரியருக்கும் இடையே மோதல் ஏற்பட்டது. ஆசிரியர் ஒரு வாக்கியம் சொன்னால், அந்த மாணவி அதற்குப் பதிலாக இன்னொரு வாக்கியத்தைச் சொன்னார். இருவரின் வார்த்தைகளும் ஒன்றன்பின் ஒன்றாகத் தொடர்ந்தன. சூழ்நிலையும் படிப்படியாக மேலும் பதற்றமாக மாறியது. அப்போது அந்தச் சம்பவம் எவ்வளவு தீவிரமானது என்பதை நாங்கள் உண்மையாகப் புரிந்துகொள்ளாமல் இருந்திருக்கலாம். அல்லது அருகில் நின்று பார்த்துக்கொண்டிருந்தாலும், அந்த வாக்குவாதம் ஆசிரியரை இவ்வளவு வருத்தப்படுத்தும் என்று நினைக்காமல் இருந்திருக்கலாம்.',
        'இறுதியில், ஆசிரியரால் உண்மையிலேயே கண்ணீரைக் கட்டுப்படுத்த முடியவில்லை.',
        'ஆசிரியர் கோபத்துடன் கதவை மூடிவிட்டு வெளியேறியபோது, சத்தமாகக் கூச்சலிட்டுக்கொண்டிருந்த வகுப்பறை திடீரென்று அமைதியாகிவிட்டது. ஒரு கணத்திற்கு முன்பு வரை கலகலப்பாக இருந்த நாங்கள், ஒரே நேரத்தில் எங்கள் குரலை இழந்துவிட்டதைப் போல இருந்தது. அந்தக் கணத்தில்தான், இது இனிமேலும் சாதாரணமான வாய்த்தகராறு அல்ல, வழக்கமான வகுப்பறை மோதல் மட்டுமல்ல என்பதை அனைவரும் மெதுவாக உணரத் தொடங்கினோம்.',
        'எப்போதும் மேடையில் நின்று எங்களுக்குக் கணிதம் கற்பித்து, பொறுமையாகக் கணக்குகளை விளக்கும் அந்த ஆசிரியருக்கும் எங்களுடைய வார்த்தைகளாலும் நடத்தையாலும் மனவேதனை ஏற்படலாம்; அவராலும் ஒரு கட்டத்தில் தாங்கிக்கொள்ள முடியாமல் போகலாம் என்பது அப்போதுதான் எங்களுக்குப் புரிந்தது.',
        'அந்த நேரத்தில், இரண்டு ஆண் மாணவர்களும் மூன்று பெண் மாணவிகளும் ஆசிரியர் உண்மையாகவே வருத்தமடைந்துவிட்டார் என்பதை முதலில் உணர்ந்துகொண்டார்கள். பின்னர், ஒரு மாணவர் தானாகவே ஆசிரியரிடம் சென்று, “மன்னிக்கவும்” என்று கூறினார்.',
        'அந்த மன்னிப்புக் கோரல் உடனடியாக எல்லா வருத்தங்களையும் மறையச் செய்யாமல் இருந்திருக்கலாம். இருந்தாலும், ஆசிரியரின் உணர்வுகளை நாங்கள் அலட்சியப்படுத்தவில்லை என்பதை உங்களுக்குத் தெரியப்படுத்தவே நாங்கள் விரும்பினோம். அப்போது நாங்கள் இன்னும் போதுமான அளவு பக்குவமடையாமல் இருந்திருக்கலாம். எங்களுடைய உணர்வுகளை எப்படிச் சரியாக வெளிப்படுத்துவது என்பது தெரியாமல் இருந்திருக்கலாம். ஒருவருக்குப் பதிலுக்குப் பதில் பேசுவதும், சிந்திக்காமல் சொல்லும் ஒரு வார்த்தையும் மற்றவரை வருத்தப்படுத்தக்கூடும் என்பதையும் புரிந்துகொள்ளாமல் இருந்திருக்கலாம்.',
        'கணித ஆசிரியரே, எங்களை மன்னித்துவிடுங்கள்.',
        'நாங்கள் புரிந்துகொள்ளாமல் நடந்துகொண்ட பல தருணங்களுக்காக மன்னிக்கவும். சில நேரங்களில் வாதிடுவதில் மட்டுமே கவனம் செலுத்தி, நீங்கள் சொல்வதைச் சரியாகக் கேட்க மறந்ததற்காக மன்னிக்கவும். ஒவ்வொரு நாளும் நீங்கள் மேடையில் நின்று, நாங்கள் கற்றுக்கொள்ளவும் முன்னேறவும் வேண்டும் என்ற எண்ணத்துடன் அறிவைப் பகிர்ந்துகொண்டீர்கள். ஆனால் சில நேரங்களில், நாங்கள் உங்களுக்குக் கொடுக்க வேண்டிய மரியாதையை வழங்கவில்லை.',
        'எங்களால் நீங்கள் வருத்தமடைந்தபோதும், மீண்டும் மீண்டும் பொறுமையுடன் எங்களுக்குக் கற்பித்ததற்கு நன்றி. அந்த ஒரு மோதலுக்குப் பிறகும் தொடர்ந்து எங்களுக்குக் கற்பிப்பதை நிறுத்தாமல் இருந்ததற்கு நன்றி. நாங்கள் கணிதக் கணக்குகளைக் கற்றுக்கொள்ள வேண்டும் என்பதற்காக மட்டுமல்ல; மற்றவர்களை மதிக்கவும், பொறுப்பை ஏற்கவும், மோதல்கள் ஏற்படும்போது நன்றாகப் பேசித் தீர்த்துக்கொள்ளவும் வேண்டும் என்பதற்காகவும் நீங்கள் விரும்பினீர்கள் என்பதை நாங்கள் அறிவோம்.',
        'ஒருவேளை அப்போது இந்த வார்த்தைகளை உங்களிடம் சொல்லாமல் இருந்திருக்கலாம். ஆனால் இப்போது, மனப்பூர்வமாக உங்களுக்கு நன்றி சொல்லவும், மன்னிப்புக் கேட்கவும் விரும்புகிறோம்.',
        'எதிர்காலத்தில் நீங்கள் எங்கள் வகுப்பை நினைத்துப் பார்க்கும்போது, உங்களுக்குத் தலைவலியை ஏற்படுத்திய நாட்களை மட்டும் நினைவுகூராமல், எங்கள் அறியாமையை நாங்கள் உணர்ந்துகொண்டதையும், உங்களிடம் மன்னிப்புக் கேட்டதையும், வளர்ச்சிப் பயணத்தில் உங்கள் சிரமங்களையும் அர்ப்பணிப்பையும் மெதுவாகப் புரிந்துகொள்ளத் தொடங்கியதையும் நினைவில் வைத்திருப்பீர்கள் என்று நம்புகிறோம்.',
        'ஏனெனில், உங்களுடைய நினைவுகளில் நாங்கள் உங்களை வருத்தப்படுத்திய மாணவர்களாக மட்டுமே இருக்க வேண்டாம் என்று விரும்புகிறோம். அதற்குப் பதிலாக, இன்னும் பக்குவமடையாத, சில நேரங்களில் தவறு செய்யும், ஆனால் படிப்படியாக வளர்ந்துகொண்டிருந்த குழந்தைகளுக்குக் கற்பித்த ஆசிரியராக நீங்கள் எங்களை நினைவுகூர வேண்டும் என்று விரும்புகிறோம்.',
        'நாங்களும் ஒரு கணித ஆசிரியரை நினைவில் வைத்திருப்போம். சில நேரங்களில் எங்களால் வருத்தமடைந்தாலும், தொடர்ந்து எங்களுக்கு உண்மையாகக் கற்பித்த ஆசிரியரை.',
        'நன்றி, கணித ஆசிரியரே.',
        'எங்கள் அறிவியல் ஆசிரியரும் அதே நேரத்தில் எங்கள் வகுப்பு ஆசிரியருமான நீங்கள், இந்த மூன்று ஆண்டுகளிலும் எங்களுடன் பயணித்த மிக முக்கியமான ஒருவராக இருந்தீர்கள்.',
        'நாங்கள் அளவுக்கு அதிகமாகக் குறும்பு செய்தபோதோ, அல்லது நீங்கள் தீவிரமாகக் கவனிக்க வேண்டிய சூழ்நிலை ஏற்பட்டபோதோ, நீங்கள் எப்போதும் ஒரு வாக்கியத்தைச் சொல்வீர்கள்: “நாம் ஒரே வகுப்பைச் சேர்ந்தவர்கள்.”',
        'இந்த வாக்கியம் கேட்பதற்குச் சாதாரணமாக இருக்கலாம். ஆனால் இப்போது நினைத்துப் பார்க்கும்போது, அதில் பல அர்த்தங்கள் இருப்பதை உணர்கிறோம். நாம் ஒரே வகுப்பைச் சேர்ந்தவர்கள் என்பதால், நம்மைப் பற்றி மட்டுமே சிந்திக்கக் கூடாது. நாம் ஒரே வகுப்பைச் சேர்ந்தவர்கள் என்பதால், ஒருவரையொருவர் புரிந்துகொள்ளவும், பொறுத்துக்கொள்ளவும் கற்றுக்கொள்ள வேண்டும். நம்முடைய செயல்களுக்குப் பொறுப்பேற்கவும் வேண்டும். ஒரு வகுப்பில் ஒருபோதும் பிரச்சினைகள் ஏற்படாமல் இருக்க முடியாது; அனைவரும் ஒரே மாதிரியாகவும் இருக்க முடியாது. ஆனால், நாம் ஒருவருடைய நிலைப்பாட்டில் இருந்து சிந்திக்கத் தயாராக இருந்தால், ஒன்றாகச் சேர்ந்து இன்னும் சிறந்தவர்களாக மாற முடியும்.',
        'நாங்கள் குறும்பு செய்யும்போது எங்களை நினைவூட்டியதற்கும், எங்களைக் கட்டுப்படுத்த வேண்டிய நேரங்களில் எங்களைத் தீவிரமாக வழிநடத்தியதற்கும் நன்றி. வகுப்பறையில் விளையாட எங்களுக்கு அனுமதி அளித்ததற்கும் நன்றி. இதனால் கற்றல் என்பது பாடப்புத்தகங்கள், வீட்டுப்பாடங்கள், தேர்வுகள் ஆகியவற்றை மட்டும் கொண்டதாக இருக்கவில்லை. சிரிப்பும் மகிழ்ச்சியும் நிறைந்த வகுப்புகள், பரபரப்பான படிப்பு வாழ்க்கைக்கு நடுவில் சில இலகுவான, மகிழ்ச்சியான தருணங்களையும் எங்களுக்கு வழங்கின.',
        'பல ஆண்டுகளுக்குப் பிறகு, நாங்கள் செய்த ஒவ்வொரு கணக்கையும் நினைவில் வைத்திருக்காமல் இருக்கலாம். ஆனால், முழு வகுப்பையும் சிரிக்க வைத்த அந்தப் பாடங்களையும், ஆசிரியர் சொன்ன “நாம் ஒரே வகுப்பைச் சேர்ந்தவர்கள்” என்ற வார்த்தைகளையும் நினைவில் வைத்திருக்கக்கூடும்.',
        'மலாய் மொழி ஆசிரியருக்கும் எங்களுடைய நன்றியைத் தெரிவித்துக்கொள்கிறோம். எங்களுக்குத் தொடர்ந்து அக்கறையுடன் கற்பித்ததற்கு நன்றி. விஷயங்களை விளக்குவதற்கும், எங்களுக்கு வழிகாட்டுவதற்கும் நேரம் ஒதுக்கியதற்கு நன்றி. இதன் மூலம் நாங்கள் படிப்படியாக முன்னேற முடிந்தது. உங்களுடைய தீவிரமான முயற்சியையும் அக்கறையையும் நாங்கள் கவனித்திருக்கிறோம். சில நேரங்களில் எங்களால் உடனடியாகச் சிறப்பாகச் செய்ய முடியாமல் இருந்தாலும், அதனால் நீங்கள் பொறுமையை இழக்காமல் தொடர்ந்து எங்களை முன்னோக்கி வழிநடத்தியதற்கு நன்றி.',
        'சீன மொழி ஆசிரியருக்கும் நன்றி. எங்களுடன் பல வகுப்புத் தருணங்களைப் பகிர்ந்துகொண்டதற்கு நன்றி. எப்படியாவது உங்களைச் சிரிக்க வைக்க நாங்கள் ஒரு வழியைக் கண்டுபிடித்துவிடுவோம். சில நேரங்களில் எந்த வார்த்தையோ, எந்தச் செயலோ உங்களை மீண்டும் சிரிக்க வைத்தது என்பதுகூட எங்களுக்கே தெரியாமல் இருக்கலாம். இப்போது நினைத்துப் பார்க்கும்போது, வகுப்பறையில் ஆசிரியருடன் இப்படிப்பட்ட மகிழ்ச்சியான தொடர்புகளைப் பகிர்ந்துகொள்ள முடிந்தது உண்மையிலேயே அரிய விஷயம்.',
        'சீன மொழிப் பாடம் என்பது எழுத்துகளையும் அறிவையும் கற்றுக்கொள்ளும் இடமாக மட்டுமே இல்லாமல், பல இலகுவான, அன்பான நினைவுகளையும் விட்டுச் சென்றதற்கு நன்றி. வகுப்பின்போது நாங்கள் சொன்ன ஏதாவது ஒரு வார்த்தை உங்களைச் சிரிக்க வைத்திருக்கலாம்; நாங்கள் செய்த ஏதாவது ஒரு எதிர்வினை சாதாரணமான பாடத்தை இன்னும் கலகலப்பாக மாற்றியிருக்கலாம். இவை அனைத்தும் சாதாரணமான சிறிய விஷயங்களாகத் தோன்றினாலும், இன்று நினைத்துப் பார்க்கும்போது எங்கள் மனதில் மதிப்புமிக்க நினைவுகளாக இருக்கின்றன.',
        'படிவம் 1 முதல் படிவம் 3 வரை எங்களுக்குக் கற்பித்த ஆங்கில ஆசிரியர்களுக்கும் நாங்கள் சிறப்பாக நன்றி சொல்ல விரும்புகிறோம்.',
        'இந்த மூன்று ஆண்டுகளில் எங்களுடைய ஆங்கில ஆசிரியர்கள் மாறிக்கொண்டே இருந்தாலும், எங்களுக்குக் கற்பித்த ஒவ்வொரு ஆங்கில ஆசிரியரும் எங்களுடைய நன்றிக்குரியவர்களே. எங்களுக்குக் கற்பித்ததற்கும், இந்தக் காலத்தில் எங்களுக்காக எடுத்த முயற்சிகளுக்கும் நன்றி.',
        'குறிப்பாக, படிவம் 3-க்கு வந்தபோது ஆங்கில வகுப்பின் ஒழுங்கு மிகவும் குழப்பமாக மாறிவிட்டது. சில நேரங்களில், சில மாணவர்கள் ஆசிரியர் சொல்வதைக் கேட்காமல், வகுப்பறையில் அனைவரின் முன்னிலையிலும் உரக்கக் கூச்சலிட்டு ஆரவாரம் செய்தார்கள். இப்போது திரும்பிப் பார்க்கும்போது, சில நேரங்களில் நாங்கள் உண்மையிலேயே சரியாக நடந்துகொள்ளவில்லை என்பதை அறிவோம். எங்கள் நடத்தையால் ஆங்கில ஆசிரியர்களுக்கு உதவியற்ற உணர்வும் தலைவலியும் ஏற்பட்டிருக்கலாம்.',
        'இந்த மூன்று ஆண்டுகளில் எங்களுக்குக் கற்பித்த ஆங்கில ஆசிரியர்கள் எத்தனை முறை மாறியிருந்தாலும், எங்களுக்குக் கற்பித்த ஒவ்வொரு ஆங்கில ஆசிரியரிடமும் இந்த வாய்ப்பைப் பயன்படுத்தி நன்றி சொல்ல விரும்புகிறோம். எங்கள் வகுப்பறைக்குள் வந்து எங்களுக்குக் கற்பித்ததற்கும், எங்களுக்காக நேரத்தையும் உழைப்பையும் செலவிட்டதற்கும் நன்றி. சில ஆசிரியர்கள் இப்போது எங்களுக்குக் கற்பிக்காமல் இருக்கலாம். ஆனால், நீங்கள் எங்களுக்குக் கற்பித்தீர்கள் என்ற உண்மையை நாங்கள் தொடர்ந்து நினைவில் வைத்திருப்போம்.',
        'நிச்சயமாக, எங்களுக்குக் கற்பித்த மற்ற பல ஆசிரியர்களும் இருக்கிறார்கள்.',
        'எங்கள் நடத்தையால் நீங்கள் கோபமடைந்திருக்கலாம்; சில நேரங்களில் எங்களைப் பற்றி என்ன செய்வது என்று தெரியாமல் இருந்திருக்கலாம். சில சமயங்களில், எங்களைத் தீவிரமாகக் கண்டிக்க வேண்டும் என்று முடிவு செய்திருந்தாலும், இறுதியில் எங்களிடம் மனம் இளகியிருக்கலாம்.',
        'எங்களுக்கு வாய்ப்புகள் வழங்கியதற்கும், எங்களுடைய பக்குவமின்மையைப் பொறுத்துக்கொண்டதற்கும், நாங்கள் சரியாகச் செய்யாதபோது மீண்டும் மீண்டும் நினைவூட்டி, திருத்தியதற்கும் நன்றி. ஆசிரியர்கள் மனம் இளகுவதால் நாங்கள் விருப்பம்போல் நடந்துகொள்ளலாம் என்று அர்த்தமல்ல என்பதை நாங்கள் அறிவோம். நீங்கள் எங்களைத் தீவிரமாக வழிநடத்தினாலும், அதே நேரத்தில் எங்கள்மீது அக்கறையும் வைத்திருக்கிறீர்கள் என்பதையே அது காட்டுகிறது.',
        'நாங்கள் தவறு செய்த பிறகும், எங்களால் வளரவும் கற்றுக்கொள்ளவும் முடியும் என்று தொடர்ந்து நம்பியதற்கு நன்றி.',
        'இப்போது திரும்பிப் பார்க்கும்போது, எங்கள் மூன்று ஆண்டு வாழ்க்கையில் சத்தம், சிரிப்பு, நகைச்சுவை, அவ்வப்போது ஆசிரியர்களுக்குத் தலைவலியை ஏற்படுத்திய தருணங்கள் ஆகியவை எப்போதும் இருந்ததைப் போலத் தோன்றுகிறது. சில நேரங்களில் நாங்கள் அளவுக்கு அதிகமாக உற்சாகமடைந்தோம்; சில நேரங்களில் போதுமான பக்குவமின்றி நடந்துகொண்டோம்; சில நேரங்களில் ஆசிரியர்களும் புரிந்துகொள்ளப்படவும் மதிக்கப்படவும் வேண்டியவர்கள் என்பதை மறந்துவிட்டோம்.',
        'ஆனால், நீங்கள் கற்றுக்கொடுத்ததாலும் எங்களைப் பொறுத்துக்கொண்டதாலும், ஒவ்வொரு அனுபவத்தின் வழியாகவும் நாங்கள் படிப்படியாக வளர முடிந்தது.',
        'ஒவ்வொரு பாடத்திலும் கற்றுக்கொண்ட அனைத்தையும் நாங்கள் நினைவில் வைத்திருக்காமல் இருக்கலாம். ஒவ்வொரு தேர்விலும் நல்ல மதிப்பெண்களையும் பெற்றிருக்காமல் இருக்கலாம். ஒருவேளை நாங்கள் உங்களை ஏமாற்றியிருக்கலாம்; உங்களுக்குக் கவலையையும் ஏற்படுத்தியிருக்கலாம். இருந்தாலும், எங்களுக்காக நீங்கள் செலவிட்ட நேரமும் உழைப்பும் வீணாகவில்லை என்பதை நம்புங்கள்.',
        'ஏனெனில், பாடப்புத்தக அறிவைத் தவிர, மற்றவர்களுடன் எப்படிப் பழகுவது, தவறுகளை எப்படி எதிர்கொள்வது, நம்முடைய செயல்களுக்குப் பொறுப்பேற்பது எப்படி, ஒரு குழுவில் இருக்கும்போது மற்றவர்களை எப்படிப் புரிந்துகொண்டு பொறுத்துக்கொள்வது என்பதையும் நீங்கள் எங்களுக்குக் கற்றுக்கொடுத்தீர்கள்.',
        'அப்போது சாதாரணமாகத் தோன்றிய அந்த நினைவூட்டல்கள், முன்பு கேட்டபோது எரிச்சலாகத் தோன்றிய அறிவுரைகள், எங்களைப் பயமுறுத்திய கண்டிப்புகள்கூட இன்று படிப்படியாக வேறொரு அர்த்தத்தைப் பெற்றுள்ளன.',
        'ஆசிரியர்களே, இங்கே எழுதிக்கொண்டிருக்கும்போதுதான் மூன்று ஆண்டுகள் உண்மையிலேயே மிகக் குறுகிய காலம் என்பதை உணர்கிறோம்.',
        'ஒவ்வொரு நாளையும் தெளிவாக நினைவில் வைத்துக்கொள்வதற்குள், எங்கள் இடைநிலைப் பள்ளி வாழ்க்கையின் இறுதிக்கட்டத்தை வந்தடைந்துவிட்டோம். ஒவ்வொரு நாளும் சந்தித்த ஆசிரியர்கள், பழக்கமான வகுப்பறை, ஒருபோதும் முடிவடையாது என்று நினைத்த பாட நேரங்களும் இடைவேளைகளும்—இவை அனைத்தும் இப்போது வேறொரு அர்த்தத்தைப் பெறத் தொடங்கியுள்ளன.',
        'இதை நினைக்கும்போது, உண்மையிலேயே சிறிது பிரிய மனமில்லை.',
        'பழக்கமான குரல்களைப் பிரிய மனமில்லை; சத்தமும் கூச்சலும் நிறைந்த அன்றாட வாழ்க்கையைப் பிரிய மனமில்லை; முன்பு இயல்பான ஒன்றாகக் கருதிய உங்கள் உடனிருப்பையும் பிரிய மனமில்லை.',
        'இளமை என்பது பெரிய, பரபரப்பான சம்பவங்களால் மட்டுமே உருவாகுவதில்லை என்பதை இப்போது உணர்கிறோம். பெரும்பாலும், ஒரு குழுவினர் ஒன்றாகக் கழிக்கும் சாதாரணமான நாட்கள்தான் அது. மேடையில் நின்று பாடம் நடத்தும் ஆசிரியரின் உருவம், வகுப்பறையில் தொடர்ந்து ஒலிக்கும் சிரிப்புகள், அப்போது பெரிதாகக் கவனிக்காதிருந்தாலும் இன்று நன்றாகப் பாதுகாத்துக்கொள்ள விரும்பும் அந்தத் தருணங்கள்—இவையே இளமைக்காலத்தின் உண்மையான நினைவுகள்.',
        'உண்மையில், நாங்கள் படிவம் 4-க்குச் சென்ற பிறகும் பள்ளியில் உங்களைச் சந்திக்கும் வாய்ப்பு இருக்கும் என்பதை அறிவோம்.',
        'பள்ளியின் நடைபாதையில் உங்களைச் சந்திக்கலாம்; உங்கள் வகுப்பறையைக் கடந்து செல்லும்போது உங்களுக்கு வணக்கம் சொல்லலாம்; சில நேரங்களில் நின்று உங்களுடன் சில வார்த்தைகளும் பேசலாம். அடுத்த முறை சந்திக்கும்போதும், நாங்கள் வழக்கம்போலச் சிரித்துக்கொண்டு உங்களுக்கு வணக்கம் சொல்லலாம்; முன்பு போலவே உங்களுடன் நகைச்சுவையாகவும் பேசலாம்.',
        'எனவே, இது என்றென்றும் விடைபெறும் கடிதம் அல்ல.',
        'எங்கள் இடைநிலைப் பள்ளியின் மூன்று ஆண்டு கதைகள் முழுமையாகக் கடந்தகாலமாக மாறுவதற்கு முன்பு, உங்களிடம் ஒரு விஷயத்தை மனப்பூர்வமாகச் சொல்ல விரும்புகிறோம்: நன்றி.',
        'ஏனெனில், எதிர்காலத்தில் நாங்கள் மீண்டும் சந்திக்கலாம் என்பதால், முன்பு போலவே ஒவ்வொரு நாளும் ஒரே வகுப்பறையில் இயல்பாக ஒன்றாக இருக்க முடியும் என்று அர்த்தமல்ல. உங்கள் பாடங்களைக் கேட்கவும், உங்களால் நினைவூட்டப்படவும், இடைவேளையில் சத்தமாகக் கூச்சலிட்டு, அடுத்த நாள் எதுவும் நடக்காததுபோல் மீண்டும் வகுப்பறைக்குத் திரும்பவும் இனிமேல் முடியாது.',
        'எதிர்காலத்தில் நாங்கள் அதே நடைபாதையில் நடந்து செல்லலாம்; அதே பழக்கமான முகங்களைக் காணலாம். ஆனால், அப்போது உங்கள் வகுப்பறையில் அமர்ந்திருந்த அந்த வகுப்பு மாணவர்களாக நாங்கள் இருக்கமாட்டோம்.',
        'ஒருவேளை ஒரு நாள் நீங்கள் வகுப்பறைக்குள் நுழையும்போது, எங்கள் இருக்கைகளில் புதிய மாணவர்கள் அமர்ந்திருப்பார்கள். அல்லது வேறொரு நாளில், இன்னொரு குறும்புக்கார வகுப்பைச் சந்தித்து, முன்பு இருந்த எங்களை நினைத்துப் பார்க்கலாம்.',
        'அப்போது, ஒருகாலத்தில் உங்களுக்குப் பாடம் கற்பிக்க வேண்டியிருந்த ஒரு வகுப்பு இருந்தது என்பதை நினைவுகூர்வீர்களா என்று தெரியவில்லை. படிவம் 1-இல் “சின்னத் தேவதைகள்” போல இருந்த அந்த வகுப்பு, படிவம் 2-இல் மெதுவாக “குறும்புப் பிசாசுகளாக” மாறி, படிவம் 3-இல் சிரிப்பதா அழுவதா என்று தெரியாத அளவுக்குச் சத்தம் போட்டதை நினைவுகூர்வீர்களா?',
        'எப்போதும் கோழிக்கால் சாப்பிட வேண்டும் என்று கேட்டுக்கொண்டிருந்த அந்தப் பெண் மாணவியை நினைவுகூர்வீர்களா?',
        'மற்ற வகுப்புகளால் “மொக்கை நகைச்சுவைகளின் திறந்த மூல மையம்” என்று அழைக்கப்பட்ட அந்த வகுப்பை நினைவுகூர்வீர்களா?',
        'இடைவேளையின்போது ஆசிரியரின் மேசையைச் சுற்றிக் கூட்டமாக அமர்ந்து, ஒவ்வொரு நாளும் முக்கியமான “ஐக்கிய நாடுகள் சபைக் கூட்டம்” நடத்துவதைப் போல இருந்த மாணவர்களை நினைவுகூர்வீர்களா?',
        'இறுதியாக ஓய்வெடுக்கப் போகிறோம் என்ற மகிழ்ச்சியில் வெள்ளிக்கிழமை பள்ளி முடிவதற்கு முன்பே பைத்தியக்காரத்தனமாகக் கூச்சலிட்ட அந்த வகுப்பை நினைவுகூர்வீர்களா?',
        'அல்லது, ஒரு பாடத்தின்போது எங்களால் ஏற்கெனவே மிகவும் கோபமடைந்திருந்தாலும், உங்கள் உணர்ச்சிகளைக் கட்டுப்படுத்திக்கொண்டு, மேடையில் தொடர்ந்து நின்று கற்பிக்க வேண்டிய பாடத்தை அக்கறையுடன் முடித்த அந்தத் தருணத்தை நினைவுகூர்வீர்களா?',
        'ஆசிரியர்களே, நீங்கள் பல தலைமுறை மாணவர்களுக்குக் கற்பித்திருக்கலாம்; பலவிதமான வகுப்புகளைச் சந்தித்திருக்கலாம். உங்களைப் பொறுத்தவரை, நாங்கள் உங்கள் ஆசிரியர் பணிக்காலத்தில் கற்பித்த பல வகுப்புகளில் ஒன்றாக மட்டுமே இருக்கலாம். மூன்று ஆண்டுகளுக்குப் பிறகு, புதிய மாணவர்கள் வகுப்பறைக்குள் வருவார்கள்; புதிய கதைகளும் தொடர்ந்து உருவாகும்.',
        'ஆனால், எங்களைப் பொறுத்தவரை, எங்கள் இடைநிலைப் பள்ளியின் மூன்று ஆண்டுகளில் உண்மையாக இருந்தும், எங்களுடன் பயணித்தும், எங்களுக்குத் துணையாக இருந்தவர்கள்தான் நீங்கள்.',
        'நாங்கள் படிவம் 1-இல் இருந்தபோது நீங்கள் எங்களைப் பார்த்தீர்கள்; படிவம் 2-இல் ஏற்பட்ட மாற்றங்களையும் பார்த்தீர்கள்; பின்னர் படிவம் 3 வரை வளர்ந்ததையும் பார்த்தீர்கள். எங்களுடைய மிகவும் மரியாதையான தோற்றத்தையும் நீங்கள் பார்த்திருக்கிறீர்கள்; அதேபோல், எங்களுடைய மிகவும் குறும்பான, உங்களுக்குச் சற்றும் ஓய்வளிக்காத தோற்றத்தையும் பார்த்திருக்கிறீர்கள். சில நேரங்களில் நீங்கள் எங்களால் ஏமாற்றமடைந்திருக்கலாம்; எங்களுடைய முன்னேற்றத்தால் மகிழ்ச்சியும் அடைந்திருக்கலாம்.',
        'இந்த விஷயங்கள் உங்களைப் பொறுத்தவரை அன்றாட வேலையின் ஒரு பகுதியாக மட்டுமே இருந்திருக்கலாம். ஆனால், எங்களைப் பொறுத்தவரை, மீண்டும் அதேபோல் திரும்பப் பெற முடியாத ஒரு காலப்பகுதியாகும்.',
        'நாங்கள் எவ்வளவு சிறந்தவர்கள் என்று உங்களை நினைக்க வைக்க வேண்டும் என்பதற்காக இதை எழுதவில்லை. நாங்கள் செய்த தவறுகளை நீங்கள் மறந்துவிட வேண்டும் என்பதற்காகவும் எழுதவில்லை.',
        'பல ஆண்டுகளுக்குப் பிறகு, நீங்கள் எப்போதாவது 2024 முதல் 2026 வரையிலான காலத்தை நினைத்துப் பார்க்கும்போது, ஒருகாலத்தில் நீங்கள் கற்பித்த ஒரு வகுப்பு இருந்தது என்பதை நினைவில் வைத்திருக்க வேண்டும் என்பதே எங்களுடைய விருப்பம்.',
        'முழுமையானதாக இல்லாவிட்டாலும், எண்ணற்ற கதைகளைக் கொண்டிருந்த ஒரு வகுப்பு.',
        'உங்களைச் சில நேரங்களில் கோபப்படுத்திய, உதவியற்ற நிலைக்குத் தள்ளிய, ஆனால் நீங்கள் வருத்தமடைந்ததை உணர்ந்தபோது தாங்களும் மனம் வருந்திய ஒரு வகுப்பு.',
        'ஒவ்வொரு நாளும் உங்களைப் பெருமைப்படுத்தியிருக்காமல் இருக்கலாம்; ஆனால் உங்களுக்கு உண்மையாக நன்றி கூறிய ஒரு வகுப்பு.',
        'ஒவ்வொரு முறையும் உங்கள் எதிர்பார்ப்புகளை எங்களால் பூர்த்திசெய்ய முடியாமல் இருந்திருக்கலாம். எங்களுடைய மதிப்பெண்களால் ஒவ்வொரு ஆசிரியரையும் பெருமைப்படுத்தவும் முடியாமல் இருந்திருக்கலாம். இருந்தாலும், எதிர்காலத்தில் நீங்கள் இந்த நாட்களை நினைவுகூரும்போது, எங்களுடைய மனதில் உங்களுக்குரிய இடம் எங்களுடைய மதிப்பெண்களாலும், காலத்தாலும், எதிர்காலத்தில் நாங்கள் எவ்வளவு தூரம் சென்றாலும் மாறாது என்பதை அறிந்துகொள்ள வேண்டும் என்று விரும்புகிறோம்.',
        'எங்களுடைய நடத்தையால் எப்போதாவது நீங்கள் வருத்தமடைந்திருந்தால், அப்போது போதுமான பக்குவமில்லாத எங்களை மன்னித்துவிடுங்கள். நீங்கள் கூறிய அறிவுரைகளில் ஏதாவது ஒன்றை அப்போது நாங்கள் கவனமாகக் கேட்காமல் இருந்திருந்தால், நாங்கள் இப்போது மெதுவாக வளர்ந்து வருகிறோம்; முன்பு புரியாத விஷயங்களைப் புரிந்துகொள்ளக் கற்றுக்கொண்டிருக்கிறோம் என்பதைத் தெரிந்துகொள்ளுங்கள்.',

  var currentLang = 'zh';
  var langBtns = Array.prototype.slice.call(document.querySelectorAll('.lang-btn'));

  function applyLang(code){
    var key = I18N[code] ? code : 'zh';
    var dict = I18N[key];
    currentLang = key;

    document.documentElement.lang = dict.lang;
    document.title = dict.title;

    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
      var k = el.getAttribute('data-i18n');
      if(dict[k] != null) el.textContent = dict[k];
    });

    // The body is a variable-length list of paragraphs, so it is rebuilt
    // instead of being swapped node-by-node.
    bodyEl.textContent = '';
    (dict.body || []).forEach(function(text){
      var p = document.createElement('p');
      p.textContent = text;
      bodyEl.appendChild(p);
    });

    langBtns.forEach(function(b){
      var on = b.getAttribute('data-lang') === key;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    var label = !hasMusic() ? dict.musicNone : (playing ? dict.musicPause : dict.musicPlay);
    musicBtn.setAttribute('aria-label', label);
    musicBtn.setAttribute('title', label);

    try{ localStorage.setItem('letterLang', key); }catch(e){}

    // The narration belongs to the previous language: stop it and re-point the button.
    stopReading();
    updateReadUI();

    // Translation lengths differ, so re-measure an open letter instead of clipping it.
    if(letter.classList.contains('is-floating') && !closing){
      var target = finalRect();
      letter.style.transition = 'left .6s cubic-bezier(.22,1,.36,1), top .6s cubic-bezier(.22,1,.36,1),' +
                                ' width .6s cubic-bezier(.22,1,.36,1), height .6s cubic-bezier(.22,1,.36,1)';
      place(target);
      placeClose(target);
      placeHint(target);
      letter.scrollTop = 0;
      window.setTimeout(function(){ letter.style.transition = ''; syncHint(); }, 650);
    }
  }

  langBtns.forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); });
  });

  /* ---------- Voice-over (AI narration, one file per language) ----------
     The mp3s live in voice/. They are attached lazily, so opening the page never
     pulls tens of megabytes of audio. Before the first playback the reader sees
     the AI notice — unless they ticked "don't show this again". */
  var VOICE = {
    zh:'voice/zh%20voice.mp3',
    ms:'voice/bm%20voice.mp3',
    en:'voice/en%20voice.mp3',
    ta:'voice/hl%20voice.mp3'   // 作者确认：hl 就是泰米尔文语音（文件名沿用原样）
  };
  var NOTICE_KEY = 'letterVoiceNotice';
  var readBtn = document.getElementById('readBtn');
  var readLabelEl = readBtn.querySelector('.read-label');
  var readProgress = document.getElementById('readProgress');
  var noticeModal = document.getElementById('noticeModal');
  var noticeSkipBox = document.getElementById('noticeSkip');
  var noticeOkBtn = document.getElementById('noticeOk');
  var noticeCancelBtn = document.getElementById('noticeCancel');
  var readAudio = null;
  var readState = 'idle';   // idle | playing | paused

  function voiceSrc(){ return VOICE[currentLang] || null; }

  function noticeDismissed(){
    try{ return localStorage.getItem(NOTICE_KEY) === 'skip'; }catch(e){ return false; }
  }

  function updateReadUI(){
    var dict = I18N[currentLang];
    var available = !!voiceSrc();
    readBtn.classList.toggle('is-unavailable', !available);
    readBtn.classList.toggle('is-playing', readState === 'playing');
    readBtn.setAttribute('aria-pressed', readState === 'playing' ? 'true' : 'false');
    var label = !available ? dict.readNoAudio
                           : (readState === 'playing' ? dict.readPause : dict.readLabel);
    readLabelEl.textContent = label;
    readBtn.setAttribute('aria-label', label);
    readBtn.setAttribute('title', label);
  }

  function ensureAudio(){
    if(readAudio) return readAudio;
    readAudio = new Audio();
    readAudio.preload = 'metadata';
    readAudio.addEventListener('timeupdate', function(){
      if(!readAudio.duration) return;
      readProgress.style.width = (readAudio.currentTime / readAudio.duration * 100).toFixed(2) + '%';
    });
    readAudio.addEventListener('ended', function(){
      readState = 'idle';
      readProgress.style.width = '0%';
      updateReadUI();
    });
    readAudio.addEventListener('error', function(){
      readState = 'idle';
      readProgress.style.width = '0%';
      updateReadUI();
    });
    return readAudio;
  }

  function loadVoice(){
    var src = voiceSrc();
    if(!src) return null;
    var a = ensureAudio();
    if(a.getAttribute('src') !== src){
      a.setAttribute('src', src);
      a.load();
      readProgress.style.width = '0%';
    }
    return a;
  }

  function pauseMusicForReading(){
    if(!playing) return;
    bgm.pause();
    playing = false;
    musicBtn.classList.remove('playing');
    musicBtn.setAttribute('aria-pressed', 'false');
    musicBtn.setAttribute('aria-label', I18N[currentLang].musicPlay);
    musicBtn.setAttribute('title', I18N[currentLang].musicPlay);
  }

  function playReading(){
    var a = loadVoice();
    if(!a) return;
    pauseMusicForReading();
    var p = a.play();
    if(p && p.then){
      p.then(function(){ readState = 'playing'; updateReadUI(); })
       .catch(function(){ readState = 'idle'; updateReadUI(); });
    } else {
      readState = 'playing';
      updateReadUI();
    }
  }

  function pauseReading(){
    if(readAudio && readState === 'playing') readAudio.pause();
    if(readAudio) readState = readAudio.currentTime > 0 ? 'paused' : 'idle';
    updateReadUI();
  }

  function stopReading(){
    if(readAudio){
      readAudio.pause();
      readAudio.removeAttribute('src');
      try{ readAudio.load(); }catch(e){}
    }
    readState = 'idle';
    if(readProgress) readProgress.style.width = '0%';
  }

  function openNotice(){
    noticeModal.classList.add('is-open');
    noticeOkBtn.focus();
  }
  function closeNotice(){
    noticeModal.classList.remove('is-open');
    readBtn.focus();
  }

  function toggleReading(){
    if(!voiceSrc()){ updateReadUI(); return; }
    if(readState === 'playing'){ pauseReading(); return; }
    if(readState === 'paused'){ playReading(); return; }   // resume where it stopped
    if(noticeDismissed()){ playReading(); return; }
    openNotice();
  }

  readBtn.addEventListener('click', toggleReading);
  noticeOkBtn.addEventListener('click', function(){
    if(noticeSkipBox.checked){ try{ localStorage.setItem(NOTICE_KEY, 'skip'); }catch(e){} }
    closeNotice();
    playReading();
  });
  noticeCancelBtn.addEventListener('click', closeNotice);
  noticeModal.addEventListener('click', function(e){ if(e.target === noticeModal) closeNotice(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && noticeModal.classList.contains('is-open')) closeNotice();
  });

  var savedLang = null;
  try{ savedLang = localStorage.getItem('letterLang'); }catch(e){}
  applyLang(savedLang || 'zh');
})();
</script>
</body>
</html>
