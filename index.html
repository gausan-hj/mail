      body:[
        'Guru-guru yang kami kasihi,',
        'Salam sejahtera.',
        'Ketika menulis surat ini, sebenarnya ada begitu banyak perkara yang ingin kami luahkan, tetapi kami sendiri tidak tahu dari mana hendak bermula. Apabila mengenang kembali perjalanan kami dari Tingkatan 1 hingga Tingkatan 3, terasa begitu banyak kenangan yang patut kami hayati satu demi satu. Rupa-rupanya, tiga tahun boleh berlalu dengan begitu pantas, sehinggakan kami belum sempat menghargainya dengan sepenuhnya, kami sudah pun sampai ke penghujung kehidupan sekolah menengah rendah.',
        'Ketika kami menyangka bahawa masa masih panjang, tanpa disedari, kami akhirnya sedar bahawa masa yang masih tinggal untuk kami sebenarnya tidak banyak lagi. Hari-hari yang dahulu kami sangka akan berulang seperti biasa, seperti masuk kelas, keluar kelas, ditegur oleh guru dan bergurau senda dengan rakan-rakan, kini apabila dikenang kembali, rupa-rupanya menjadi kenangan yang paling sukar untuk kami lepaskan.',
        'Semasa Tingkatan 1, kami masih dikenali oleh semua orang sebagai “malaikat kecil”. Ketika itu, kami tahu menjaga adab, akan menyapa guru terlebih dahulu dan juga tahu menghormati guru. Oleh sebab itu, kami menerima banyak pujian daripada guru-guru. Pada waktu itu, kami mungkin masih sedikit kekok dan mentah, penuh dengan harapan terhadap kehidupan sekolah menengah yang bakal kami lalui, dan masih belum menunjukkan “kemampuan sebenar” kami sepenuhnya.',
        'Namun, seiring dengan berlalunya masa, kami seolah-olah mula berubah.',
        'Apabila masuk Tingkatan 2, kami perlahan-lahan berubah daripada “malaikat kecil” menjadi “syaitan kecil”. Kata-kata pelik yang tiba-tiba terkeluar semasa kelas, tingkah laku kami yang membuatkan guru-guru tidak tahu sama ada hendak ketawa atau menangis, serta pelbagai kejadian kecil yang tidak pernah habis, semuanya menjadikan kelas kami semakin meriah. Apabila masuk Tingkatan 3, kami pula benar-benar semakin bebas melakukan apa sahaja, seolah-olah melepaskan sekaligus segala tenaga yang telah kami kumpulkan sejak Tingkatan 1. Kami makan di dalam kelas, menjerit dan membuat bising, sehingga seluruh kelas kadangkala kelihatan seperti Sun Wukong yang menggemparkan Istana Syurga. Apabila mengenangnya kembali, kami benar-benar kagum dengan guru-guru kerana masih mampu menemani sekumpulan pelajar yang semakin nakal ini sepanjang tiga tahun.',
        'Sepanjang tiga tahun ini, orang datang dan pergi, wajah-wajah di sekeliling kami sentiasa berubah, tetapi kisah kelas kami tidak pernah berhenti. Ada rakan baharu yang menyertai kami, dan ada juga rakan yang meninggalkan kami. Ada guru baharu yang masuk ke kelas kami, dan ada juga guru yang pernah mengajar kami tetapi kemudiannya meninggalkan sekolah ini. Walaupun ada guru yang tidak lagi menemani kami di dalam kelas, dan ada wajah yang kini hanya tinggal dalam kenangan, hakikat bahawa cikgu pernah mengajar kami tidak akan berubah walaupun masa terus berlalu. Tidak kira sama ada cikgu menemani kami untuk tempoh yang panjang atau singkat, cikgu tetap menjadi sebahagian daripada kehidupan sekolah menengah kami.',
        'Apabila bercakap tentang kenangan kelas kami, sebenarnya terlalu banyak perkara yang boleh kami ceritakan.',
        'Kami masih ingat, dari Tingkatan 1 hingga Tingkatan 2, ada seorang pelajar perempuan yang selalu mengulangi ayat ini: “Cikgu, saya nak makan paha ayam! Cikgu, saya nak makan paha ayam!” Apabila difikirkan sekarang, ayat ini seolah-olah sudah menjadi salah satu kenangan istimewa kelas kami. Mungkin ketika itu dia hanya menyebutnya secara spontan, tetapi perkara-perkara kecil yang kelihatan biasa, malah kadangkala agak pelik ini, sebenarnya menjadikan kehidupan persekolahan kami begitu menyeronokkan.',
        'Selain itu, kami juga mempunyai aktiviti jualan amal. Untuk aktiviti ini, semua orang telah membuat pelbagai persiapan. Pada waktu itu, kami sibuk bersama-sama demi mencapai matlamat yang sama dan menyelesaikan tugasan kelas kami. Apabila mengenangnya kembali, jualan amal itu bukan sekadar satu aktiviti, malah menjadi bukti bahawa kami pernah berusaha dan bekerjasama bersama-sama. Mungkin ketika itu kami hanya menumpukan perhatian untuk menyelesaikan segala urusan dengan baik, tanpa menyedari bahawa pengalaman yang dikongsi bersama ini suatu hari nanti akan menjadi cebisan kenangan zaman remaja yang sangat berharga.',
        'Sudah tentu, kelas kami juga bukanlah kelas yang sentiasa teratur setiap hari.',
        'Semasa kelas Sejarah di Tingkatan 2, pernah ada seseorang yang membuatkan guru Sejarah kami begitu marah. Apabila mengenangnya kembali, kami sedar bahawa kadangkala kami memang terlalu suka membuat bising. Kami sering terlalu mementingkan keseronokan sendiri sehingga terlupa bahawa guru juga perlu menjaga disiplin kelas dan mempunyai perasaan mereka sendiri. Namun begitu, walaupun kadangkala kami membuatkan guru Sejarah pening kepala, cikgu tetap berulang kali bertolak ansur dengan kami dan mengajar kami dengan sabar. Terima kasih kerana tidak mudah berputus asa terhadap kami hanya kerana kenakalan kami. Terima kasih juga kerana selepas berasa marah, cikgu masih sudi meneruskan pengajaran kepada kami.',
        'Apabila masuk Tingkatan 3, tahap kenakalan kami seolah-olah meningkat sekali lagi.',
        'Sebaik sahaja loceng tamat kelas berbunyi, kelas kami seolah-olah berubah menjadi dunia yang lain. Kami sering berkumpul di sekeliling meja guru tanpa dirancang. Seorang demi seorang datang mengerumuni meja itu. Ada yang duduk, ada yang mengeluarkan makanan, dan kami semua berkumpul untuk makan, berbual, bergurau dan ketawa bersama-sama. Walaupun guru itu sendiri tidak berada di situ, yang duduk di sekeliling meja guru ialah kami, para pelajarnya. Malah, kami turut makan di atas meja guru itu.',
        'Jika dilihat dari jauh, suasananya benar-benar seperti satu mesyuarat besar yang penting. Setiap orang seolah-olah mempunyai pendapat untuk disampaikan dan perkara untuk dibincangkan. Kami berkumpul dalam satu kelompok, begitu meriah dan bising. Walaupun sebenarnya hanya waktu rehat dan kami cuma berkumpul untuk makan bersama-sama, suasananya tetap kelihatan seperti semua wakil kelas telah berhimpun untuk membincangkan perkara besar.',
        'Inilah juga sebabnya kelas kami digelar “Pertubuhan Bangsa-Bangsa Bersatu” atau “PBB”. Apabila masuk Tingkatan 3, ramai pelajar daripada kelas lain turut masuk terus ke kelas kami untuk menyertai “mesyuarat” yang meriah ini. Ruang yang pada asalnya hanya milik kelas kami akhirnya berubah menjadi sebuah “PBB” kecil kerana kehadiran pelajar yang datang dan pergi. Kadangkala, apabila melihat semua orang berkumpul di tepi meja guru untuk makan, berbual dan bergurau, suasananya benar-benar seperti mesyuarat besar yang tidak akan pernah selesai.',
        'Meja guru itu pada asalnya ialah tempat yang digunakan oleh guru semasa mengajar. Namun, apabila berada di kelas kami, meja itu seolah-olah bertukar menjadi “Dewan Mesyuarat PBB”. Kami pula ialah wakil-wakil yang hadir ke mesyuarat itu tepat pada masanya setiap hari. Mungkin ketika itu kami hanya berasa seronok kerana dapat berkumpul bersama-sama, tetapi apabila mengenangnya sekarang, saat-saat kami makan, berbual dan bergurau di situ sebenarnya menjadi antara kenangan Tingkatan 3 yang paling jelas dalam ingatan kami.',
        'Dari Tingkatan 2 hingga Tingkatan 3, kelas-kelas lain turut memberikan gelaran khas kepada kelas kami, iaitu “pusat pembekal jenaka hambar”. Kami sendiri tidak tahu siapa yang telah menyumbangkan begitu banyak jenaka hambar sehingga kami mendapat nama sedemikian. Namun, memandangkan gelaran itu sudah tersebar, nampaknya kelas kami memang mempunyai “bakat humor” yang tersendiri.',
        'Selain itu, ada juga seorang pelajar perempuan yang suaranya sangat kuat. Setiap kali dia membuka mulut, kelantangan suaranya begitu keterlaluan sehingga seolah-olah hampir memecahkan gegendang telinga semua orang. Setiap kali perkara seperti ini berlaku, pasti ada lagi detik yang membuatkan seluruh kelas tidak tahu sama ada hendak ketawa atau menggelengkan kepala. Apabila mengenangnya kembali, suasana bising dan riuh itu rupa-rupanya turut menjadi sebahagian daripada kenangan yang sukar kami lepaskan.',
        'Ada juga satu hari Jumaat yang apabila dikenang sehingga hari ini, seolah-olah kami masih dapat merasai kegilaan suasana ketika itu.',
        'Oleh sebab keesokan harinya ialah hari Sabtu dan kami akhirnya dapat berehat, semua orang menjadi sangat teruja menjelang waktu pulang. Ada yang menjerit dengan kuat, malah ada yang membaling barang ke sana sini sehingga seluruh kelas menjadi huru-hara. Pada saat itu, semua orang seolah-olah sudah tidak sabar untuk keluar dari kawasan sekolah dan menyambut waktu rehat masing-masing. Apabila difikirkan sekarang, rupa-rupanya kami boleh menjadi begitu teruja hanya kerana mahu bercuti. Guru-guru pula masih perlu berusaha menjaga disiplin kelas pada hari-hari seperti ini. Cikgu benar-benar telah bersusah payah.',
        'Sampai di sini, kami juga perlu mengucapkan terima kasih secara khusus kepada guru Matematik kami.',
        'Guru Matematik, terima kasih kerana sentiasa bersabar dan bertolak ansur dengan kami selama ini. Kami tahu bahawa kami bukanlah pelajar yang sentiasa membuatkan cikgu berasa tenang. Kadangkala, walaupun kami sudah membuatkan cikgu marah, cikgu tetap berdiri di hadapan kelas untuk mengajar dengan bersungguh-sungguh dan menerangkan soalan, dengan harapan agar kami dapat memahami dan menguasainya.',
        'Namun, ada satu perkara yang apabila dikenang sehingga hari ini, masih membuatkan kami berasa sedih.',
        'Pada suatu ketika dahulu, seorang pelajar perempuan telah berselisih faham dengan guru Matematik. Setiap kali cikgu mengatakan sesuatu, dia akan menjawab kembali. Kata-kata mereka bersambung satu demi satu, dan suasana menjadi semakin tegang. Mungkin pada waktu itu kami belum benar-benar menyedari betapa seriusnya perkara tersebut. Mungkin ada antara kami yang hanya berdiri di tepi dan melihat apa yang berlaku, tanpa menyangka bahawa pertengkaran itu akan membuatkan cikgu begitu sedih.',
        'Akhirnya, cikgu benar-benar tidak dapat menahan perasaan lalu menangis.',
        'Apabila cikgu menutup pintu dengan marah lalu meninggalkan kelas, bilik darjah yang pada mulanya riuh-rendah tiba-tiba menjadi sunyi sepi. Kami yang sebentar tadi masih bising dan bergelak ketawa seolah-olah kehilangan suara dalam sekelip mata. Pada saat itu, barulah kami perlahan-lahan menyedari bahawa perkara tersebut bukan lagi sekadar pertengkaran biasa atau konflik kecil semasa kelas.',
        'Rupa-rupanya, guru yang selama ini berdiri di hadapan kelas untuk mengajar Matematik dan menerangkan soalan kepada kami dengan sabar juga boleh berasa terluka akibat kata-kata dan perbuatan kami. Cikgu juga mempunyai batas kesabaran dan ada masanya tidak mampu menanggung semuanya.',
        'Pada waktu itu, dua orang pelajar lelaki dan tiga orang pelajar perempuan merupakan antara yang mula-mula menyedari bahawa cikgu benar-benar sedang bersedih. Kemudian, ada juga rakan sekelas yang mengambil inisiatif untuk pergi berjumpa dengan cikgu dan mengucapkan “maaf”.',
        'Mungkin permohonan maaf itu tidak dapat menghilangkan semua kesedihan dengan serta-merta, tetapi sekurang-kurangnya kami berharap agar cikgu tahu bahawa kami sebenarnya mengambil berat tentang perasaan cikgu. Mungkin pada waktu itu kami masih belum cukup matang dan tidak tahu cara yang baik untuk meluahkan emosi. Kami juga tidak menyedari bahawa satu jawapan yang membantah atau satu kata-kata yang diucapkan tanpa berfikir boleh membuatkan orang lain bersedih.',
        'Guru Matematik, kami minta maaf.',
        'Maaf kerana dahulu kami sering bersikap tidak matang. Maaf kerana kadangkala kami terlalu sibuk mempertahankan pendapat sendiri sehingga terlupa untuk mendengar kata-kata cikgu dengan baik. Setiap hari, cikgu berdiri di hadapan kelas dan berusaha menyampaikan ilmu kepada kami dengan harapan agar kami dapat belajar dan maju. Namun, ada kalanya kami tidak memberikan penghormatan yang sewajarnya kepada cikgu.',
        'Terima kasih kerana walaupun kami pernah membuatkan cikgu begitu marah dan sedih, cikgu masih berulang kali mengajar kami dengan sabar. Terima kasih kerana tidak berhenti mengajar kami hanya disebabkan konflik tersebut. Kami tahu bahawa cikgu bukan sahaja mahu kami memahami soalan Matematik, tetapi juga mahu kami belajar menghormati orang lain, bertanggungjawab atas perbuatan sendiri dan berkomunikasi dengan baik apabila berlaku perselisihan faham.',
        'Mungkin pada waktu itu kami tidak meluahkan semua ini, tetapi sekarang kami ingin mengucapkan terima kasih dengan bersungguh-sungguh, dan pada masa yang sama, memohon maaf kepada cikgu.',
        'Kami berharap apabila cikgu mengenang kelas kami pada masa hadapan, selain mengingati hari-hari yang membuatkan cikgu pening kepala, cikgu juga dapat mengingati bahawa kami pernah menyedari kesilapan sendiri, pernah cuba meminta maaf dan pernah perlahan-lahan belajar memahami kesusahan serta pengorbanan cikgu sepanjang proses kami membesar.',
        'Kami tidak mahu satu-satunya perkara yang tertinggal dalam ingatan cikgu tentang kami hanyalah sekumpulan pelajar yang pernah membuatkan cikgu bersedih. Kami lebih berharap agar cikgu mengingati kami sebagai sekumpulan anak murid yang masih belum cukup matang, kadangkala melakukan kesilapan, tetapi sedang berusaha untuk membesar dan menjadi lebih baik.',
        'Kami juga akan mengingati bahawa kami pernah mempunyai seorang guru Matematik yang, walaupun kadangkala dibuat sedih oleh kenakalan kami, tetap bersungguh-sungguh mengajar kami.',
        'Terima kasih, guru Matematik.',
        'Guru Sains kami, yang juga merupakan guru kelas kami, turut menjadi salah seorang insan penting yang menemani kami sepanjang tiga tahun ini.',
        'Setiap kali kami berkelakuan terlalu nakal atau melakukan sesuatu yang memaksa cikgu mengambil perkara itu dengan serius, cikgu akan mengatakan satu ayat: “Kita satu kelas.”',
        'Ayat ini mungkin kedengaran sangat ringkas, tetapi apabila difikirkan sekarang, ayat tersebut sebenarnya membawa banyak maksud. Oleh sebab kita satu kelas, kita tidak sepatutnya hanya mementingkan diri sendiri. Oleh sebab kita satu kelas, kita perlu belajar memahami dan bertolak ansur antara satu sama lain, serta bertanggungjawab atas perbuatan sendiri. Sesebuah kelas tidak mungkin sentiasa bebas daripada masalah, dan setiap orang juga tidak mungkin mempunyai perangai yang sama. Namun, selagi kita sanggup melihat sesuatu daripada sudut pandangan orang lain, kita pasti dapat menjadi lebih baik bersama-sama.',
        'Terima kasih kerana menegur kami apabila kami terlalu nakal, mengambil serius perkara yang memerlukan kami didisiplinkan, dan juga membenarkan kami bermain permainan di dalam kelas. Dengan itu, pembelajaran bukan sekadar buku teks, kerja rumah dan peperiksaan. Kelas-kelas yang dipenuhi gelak tawa itu memberikan kami saat-saat yang santai dan menggembirakan di tengah-tengah kehidupan pembelajaran yang sibuk.',
        'Mungkin bertahun-tahun kemudian, kami tidak lagi mengingati setiap soalan yang pernah kami jawab, tetapi kami mungkin masih mengingati kelas-kelas yang pernah membuatkan seluruh kelas ketawa. Kami juga akan mengingati ayat cikgu, “Kita satu kelas.”',
        'Kami juga ingin mengucapkan terima kasih kepada guru Bahasa Melayu yang sentiasa mengajar kami dengan bersungguh-sungguh. Terima kasih kerana sudi meluangkan masa untuk menerangkan dan membimbing kami agar kami dapat membuat kemajuan sedikit demi sedikit sepanjang proses pembelajaran. Kesungguhan dan usaha cikgu sentiasa kami perhatikan. Walaupun kadangkala kami tidak dapat melakukan yang terbaik dengan serta-merta, terima kasih kerana tidak hilang kesabaran terhadap kami, sebaliknya terus membimbing kami untuk melangkah ke hadapan.',
        'Kepada guru Bahasa Cina pula, terima kasih kerana menemani kami melalui begitu banyak waktu pembelajaran. Kami sentiasa mempunyai cara untuk membuatkan cikgu ketawa. Kadangkala, kami sendiri pun tidak tahu ayat atau reaksi yang mana satu telah membuatkan cikgu ketawa. Apabila difikirkan sekarang, dapat berinteraksi dengan guru seperti ini di dalam kelas sebenarnya merupakan satu perkara yang sangat berharga.',
        'Terima kasih kerana menjadikan kelas Bahasa Cina bukan sekadar tempat untuk mempelajari tulisan dan ilmu pengetahuan, tetapi juga tempat yang meninggalkan banyak kenangan yang santai dan penuh kehangatan. Mungkin pernah ada kata-kata kami yang membuatkan cikgu tidak dapat menahan ketawa, atau mungkin kami pernah menjadikan kelas yang biasa itu lebih meriah. Namun, perkara-perkara kecil yang kelihatan biasa ini kini menjadi kenangan berharga dalam hati kami.',
        'Kami juga ingin mengucapkan terima kasih secara khusus kepada semua guru Bahasa Inggeris yang pernah mengajar kami dari Tingkatan 1 hingga Tingkatan 3.',
        'Walaupun sepanjang tiga tahun ini guru Bahasa Inggeris kami sering bertukar ganti, kami tetap ingin mengucapkan terima kasih kepada setiap guru Bahasa Inggeris yang pernah mengajar kami. Terima kasih kerana pernah mendidik kami dan terima kasih juga atas segala usaha serta pengorbanan cikgu sepanjang tempoh tersebut.',
        'Terutamanya ketika Tingkatan 3, suasana kelas Bahasa Inggeris sangat tidak teratur. Ada kalanya, sesetengah pelajar langsung tidak mendengar kata-kata guru, malah membuat bising dan bertengkar dengan suara yang kuat di dalam kelas di hadapan semua orang. Apabila mengenangnya kembali, kami sedar bahawa kadangkala tingkah laku kami memang tidak sepatutnya begitu, dan mungkin kami pernah membuatkan guru Bahasa Inggeris berasa kecewa serta pening kepala.',
        'Tidak kira berapa kali guru Bahasa Inggeris kami bertukar sepanjang tiga tahun ini, kami tetap ingin mengambil kesempatan ini untuk mengucapkan terima kasih kepada setiap guru Bahasa Inggeris yang pernah mengajar kami. Terima kasih kerana pernah melangkah masuk ke kelas kami untuk mengajar dan membimbing kami. Terima kasih juga atas masa dan tenaga yang telah cikgu curahkan kepada kami. Walaupun ada guru yang mungkin tidak lagi mengajar kami sekarang, hakikat bahawa cikgu pernah menjadi guru kami akan tetap kami ingati.',
        'Sudah tentu, masih ramai lagi guru lain yang pernah mengajar kami.',
        'Mungkin cikgu pernah marah kerana tingkah laku kami, mungkin pernah berasa tidak berdaya menghadapi kenakalan kami, dan mungkin ada kalanya cikgu sudah bertekad untuk mendisiplinkan kami dengan tegas, tetapi akhirnya tetap berlembut hati.',
        'Terima kasih kerana sudi memberikan kami peluang, bertolak ansur dengan sikap kami yang belum matang dan terus menegur serta membetulkan kesilapan kami apabila kami melakukan sesuatu yang tidak sepatutnya. Kami tahu bahawa apabila guru berlembut hati, itu bukan bermakna kami boleh berkelakuan sesuka hati. Sebaliknya, walaupun cikgu menetapkan peraturan dan mendisiplinkan kami dengan tegas, cikgu tetap mengambil berat tentang kami.',
        'Terima kasih kerana selepas kami melakukan kesilapan, cikgu masih percaya bahawa kami mampu belajar dan menjadi lebih matang.',
        'Apabila mengenang kembali, kehidupan kami sepanjang tiga tahun ini seolah-olah tidak pernah kekurangan bunyi bising, gelak tawa, gurauan dan kejadian yang kadangkala membuatkan guru pening kepala. Ada kalanya kami terlalu teruja, ada kalanya kami kurang matang, malah kadangkala kami terlupa bahawa guru juga memerlukan pemahaman dan penghormatan daripada orang lain.',
        'Namun, kerana didikan dan sikap bertolak ansur cikgu, kami dapat perlahan-lahan membesar melalui setiap pengalaman yang kami lalui.',
        'Mungkin kami tidak mampu mengingati kandungan setiap kelas, dan mungkin juga kami tidak dapat memperoleh keputusan yang baik dalam setiap peperiksaan. Mungkin kami pernah mengecewakan cikgu dan membuatkan cikgu risau. Namun, percayalah bahawa masa, usaha dan pengorbanan yang cikgu curahkan kepada kami bukanlah sesuatu yang sia-sia.',
        'Selain ilmu yang terdapat dalam buku teks, cikgu juga mengajar kami cara bergaul dengan orang lain, cara menghadapi kesilapan, cara bertanggungjawab atas perbuatan sendiri, serta cara memahami dan bertolak ansur dalam sesebuah kumpulan.',
        'Teguran yang dahulu kami anggap biasa, nasihat yang pernah membuatkan kami berasa bosan, malah teguran tegas yang pernah membuatkan kami takut, semuanya kini membawa makna yang berbeza apabila dikenang kembali.',
        'Guru-guru, apabila menulis sehingga ke bahagian ini, barulah kami menyedari bahawa tiga tahun sebenarnya sangat singkat.',
        'Terlalu singkat sehingga kami belum sempat mengingati setiap hari dengan jelas, kami sudah pun sampai ke penghujung kehidupan sekolah menengah rendah. Guru-guru yang dahulu kami temui setiap hari, kelas yang sudah menjadi kebiasaan, serta waktu pembelajaran dan waktu rehat yang pernah kami sangka tidak akan berakhir, kini semuanya membawa makna yang berbeza.',
        'Apabila memikirkan semua ini, kami benar-benar berasa sedikit berat hati untuk berpisah.',
        'Kami akan merindui suara-suara yang sudah biasa kami dengar, suasana harian yang bising dan kenangan ditemani oleh cikgu yang selama ini kami anggap sebagai sesuatu yang biasa.',
        'Rupa-rupanya, zaman remaja bukan hanya tentang perkara-perkara besar yang menggemparkan. Selalunya, zaman remaja terdiri daripada hari-hari biasa yang dilalui bersama sekumpulan orang, bayangan guru yang berdiri mengajar di hadapan kelas, gelak tawa yang bersahut-sahutan di dalam bilik darjah, serta detik-detik yang dahulu tidak begitu kami hargai tetapi kini ingin kami simpan baik-baik dalam ingatan.',
        'Sebenarnya, kami tahu bahawa selepas naik ke Tingkatan 4, kami masih berpeluang untuk bertemu dengan cikgu di sekolah.',
        'Kami mungkin masih akan terserempak dengan cikgu di koridor, menyapa cikgu apabila melalui kelas cikgu, dan sesekali berhenti untuk berbual beberapa patah perkataan. Mungkin apabila bertemu lagi nanti, kami masih akan tersenyum dan menyapa cikgu, malah mungkin masih bergurau seperti dahulu.',
        'Oleh itu, surat ini bukanlah surat perpisahan buat selama-lamanya.',
        'Kami cuma ingin mengambil kesempatan ini, selagi kisah tiga tahun sekolah menengah rendah kami belum sepenuhnya menjadi masa lalu, untuk memberitahu cikgu dengan bersungguh-sungguh: terima kasih.',
        'Kerana walaupun kami masih boleh bertemu selepas ini, itu tidak bermakna kami masih dapat berada di dalam kelas yang sama setiap hari seperti dahulu, mendengar cikgu mengajar, ditegur oleh cikgu, membuat bising ketika waktu rehat, kemudian kembali ke kelas pada keesokan harinya seolah-olah tiada apa-apa yang berlaku.',
        'Selepas ini, kami mungkin masih akan melalui koridor yang sama dan melihat wajah-wajah yang sama, tetapi kami tidak lagi menjadi kelas yang duduk di dalam bilik darjah cikgu seperti dahulu.',
        'Mungkin suatu hari nanti, cikgu akan masuk ke kelas dan melihat sekumpulan pelajar baharu duduk di tempat yang pernah menjadi tempat duduk kami. Mungkin pada suatu hari yang lain, cikgu akan bertemu dengan kelas yang nakal sekali lagi, lalu tanpa sedar teringat akan kami.',
        'Kami tertanya-tanya, pada waktu itu, adakah cikgu masih akan mengingati bahawa pernah ada sebuah kelas yang semasa Tingkatan 1 seperti “malaikat kecil”, kemudian perlahan-lahan menjadi “syaitan kecil” ketika Tingkatan 2, dan akhirnya menjadi begitu bising sehingga membuatkan orang tidak tahu sama ada hendak ketawa atau menggelengkan kepala ketika Tingkatan 3?',
        'Adakah cikgu akan teringat akan pelajar perempuan yang selalu melaungkan bahawa dia mahu makan paha ayam?',
        'Adakah cikgu akan teringat akan kelas yang digelar oleh kelas lain sebagai “pusat pembekal jenaka hambar”?',
        'Adakah cikgu akan teringat akan pelajar-pelajar yang memenuhi kawasan meja guru ketika waktu rehat, seolah-olah setiap hari sedang mengadakan “mesyuarat PBB” yang penting?',
        'Adakah cikgu akan teringat akan kelas yang menjerit dan membuat bising dengan begitu gembira pada hari Jumaat sebelum cuti kerana akhirnya dapat berehat?',
        'Atau adakah cikgu akan teringat akan suatu kelas yang pernah membuatkan cikgu begitu marah, tetapi cikgu tetap menahan perasaan dan terus berdiri di hadapan kelas untuk menghabiskan pengajaran dengan bersungguh-sungguh?',
        'Guru-guru, mungkin cikgu sudah mengajar begitu banyak kumpulan pelajar dan bertemu dengan pelbagai jenis kelas. Bagi cikgu, kami mungkin hanyalah salah satu kumpulan pelajar sepanjang kerjaya perguruan cikgu. Tiga tahun kemudian, akan ada pelajar baharu yang masuk ke kelas dan kisah-kisah baharu yang akan terus tercipta.',
        'Namun, bagi kami, cikgu ialah insan yang benar-benar pernah hadir dan menemani kami sepanjang tiga tahun sekolah menengah rendah ini.',
        'Cikgu melihat kami membesar sedikit demi sedikit sejak Tingkatan 1, melalui perubahan ketika Tingkatan 2, sehinggalah kami sampai ke Tingkatan 3. Cikgu pernah melihat kami ketika paling sopan, dan juga ketika kami paling nakal serta paling sukar dikawal. Mungkin cikgu pernah berasa kecewa terhadap kami, tetapi mungkin juga cikgu pernah berasa gembira melihat kemajuan kami.',
        'Semua perkara ini mungkin hanyalah sebahagian daripada tugas harian cikgu. Namun, bagi kami, semua ini merupakan satu tempoh kehidupan yang tidak mungkin dapat diulangi dengan cara yang sama.',
        'Kami bukanlah mahu cikgu menganggap kami sebagai pelajar yang sangat hebat, dan kami juga bukan mahu cikgu melupakan kesilapan yang pernah kami lakukan.',
        'Kami cuma berharap agar bertahun-tahun dari sekarang, apabila cikgu sesekali mengenang tahun 2024 hingga 2026, cikgu masih dapat mengingati bahawa pernah ada sebuah kelas yang cikgu ajar.',
        'Sebuah kelas yang tidak sempurna, tetapi mempunyai begitu banyak cerita.',
        'Sebuah kelas yang boleh membuatkan cikgu marah dan berasa tidak berdaya, tetapi pada masa yang sama akan berasa sedih apabila menyedari bahawa cikgu sendiri sedang bersedih.',
        'Sebuah kelas yang mungkin tidak membuatkan cikgu berasa bangga setiap hari, tetapi benar-benar menghargai cikgu dari hati mereka.',
        'Mungkin kami tidak sentiasa dapat memenuhi harapan cikgu, dan mungkin keputusan peperiksaan kami tidak sentiasa membuatkan setiap guru berasa bangga. Namun, kami berharap apabila cikgu mengenang kembali tempoh ini pada masa hadapan, cikgu akan tahu bahawa kedudukan cikgu dalam hati kami tidak akan berubah hanya kerana keputusan peperiksaan, peredaran masa atau sejauh mana kami melangkah dalam kehidupan nanti.',
        'Jika pernah ada tindakan kami yang membuatkan cikgu bersedih, maafkanlah kami yang ketika itu masih belum cukup matang. Jika pernah ada nasihat cikgu yang tidak kami ambil serius pada waktu itu, kami juga berharap cikgu tahu bahawa kami sedang membesar sedikit demi sedikit dan belajar memahami perkara-perkara yang dahulu tidak kami fahami.',
        'Mungkin sekarang kami masih belum dapat memahami sepenuhnya betapa susahnya tugas seorang guru. Mungkin kami juga belum tahu cara yang paling indah untuk menyampaikan rasa terima kasih. Namun, sekurang-kurangnya, ketika tiga tahun sekolah menengah rendah kami hampir berakhir, kami ingin menyampaikan penghargaan ini kepada cikgu dengan sebaik-baiknya.',
        'Terima kasih kerana tidak berhenti mengajar kami hanya kerana kami tidak sempurna.',
        'Terima kasih kerana menegur kami apabila kami melakukan kesilapan, menerangkan dengan sabar apabila kami tidak memahami sesuatu, dan tetap memberikan kami peluang walaupun kami sering membuatkan cikgu pening kepala.',
        'Terima kasih kerana membuatkan kami memahami bahawa apa yang ditinggalkan oleh seorang guru kepada pelajarnya bukan hanya ilmu daripada buku teks, tetapi juga detik-detik yang apabila dikenang bertahun-tahun kemudian, masih mampu menghangatkan hati.',
        'Guru-guru, selepas ini kami masih akan bertemu dengan cikgu di sekolah.',
        'Jadi, apabila kita bertemu lagi nanti, mungkin kami tidak akan mengucapkan terlalu banyak kata-kata yang menyentuh hati. Mungkin kami masih akan tersenyum dan menyapa cikgu seperti biasa.',
        'Namun, jika suatu hari nanti cikgu tiba-tiba teringat akan kami, teringat akan tempat duduk yang pernah kami gunakan, teringat akan kelas yang bising itu dan teringat akan hari-hari yang pernah membuatkan cikgu marah serta berasa tidak berdaya, kami berharap cikgu juga akan mengingati bahawa di sebalik semua kebisingan itu, sebenarnya ada sekumpulan pelajar yang sentiasa berterima kasih kepada cikgu.',
        'Kami akan terus membesar dan melangkah ke arah kehidupan masa hadapan masing-masing.',
        'Cikgu pula akan terus mendidik pelajar-pelajar baharu, terus berdiri di hadapan kelas dan terus menjadi guru dalam perjalanan hidup ramai pelajar.',
        'Kami cuma berharap agar, antara begitu banyak kumpulan pelajar yang pernah cikgu ajar, kami juga dapat menjadi salah satu kumpulan yang sesekali membuatkan cikgu teringat akan kami dan tersenyum kecil apabila mengenangnya.',
        'Terima kasih kerana menemani kami sepanjang tahun 2024 hingga 2026.',
        'Perkara-perkara yang kita lalui bersama sepanjang tiga tahun ini mungkin bukanlah sesuatu yang menggemparkan dunia, tetapi semuanya merupakan kenangan yang hanya dimiliki oleh kelas kami, kenangan antara cikgu dengan kami.',
        'Kami berasa sangat bertuah kerana pernah menjadi anak murid cikgu.',
        'Kami juga berasa sangat bertuah kerana ketika kami masih belum cukup matang dan belum cukup memahami banyak perkara, kami dipertemukan dengan cikgu yang sudi mengajar kami dengan sabar.',
        'Walaupun kami bukanlah pelajar cikgu yang paling cemerlang, cikgu tetap merupakan guru yang paling kami hormati.',
        'Semoga sepanjang kehidupan cikgu selepas ini, cikgu sentiasa gembira, bahagia, aman dan sihat sejahtera.',
        'Semoga setiap hari yang mendatang membawa lebih sedikit keletihan dan lebih banyak gelak tawa. Semoga kesabaran dan kasih sayang yang pernah cikgu curahkan kepada para pelajar juga dibalas dengan kebaikan dan kelembutan dalam kehidupan cikgu sendiri.',
        'Kami juga berharap bahawa apabila suatu hari nanti cikgu teringat akan kelas kami, perkara yang cikgu kenang bukanlah betapa bising dan nakalnya kami, tetapi hari-hari yang pernah kita lalui bersama dan hakikat bahawa kami pernah membesar di dalam kelas cikgu.',
        'Terima kasih, guru-guru kami.',
        'Kali ini, kami benar-benar ingin mengucapkannya dengan ikhlas.',
        'Kami bukan hendak mengucapkan selamat tinggal kepada cikgu buat selama-lamanya. Kami cuma ingin menggunakan kesempatan ketika meninggalkan sekolah menengah rendah ini untuk memberitahu cikgu dengan seikhlas hati: dapat menjadi anak murid cikgu merupakan salah satu perkara yang sangat berharga dalam zaman remaja kami.'
      ]
    },
    en: {
      lang:'en',
      title:'To All the Teachers Who Have Taught Us · 2024–2026',
      headline:'For every teacher who has ever taught us',
      letterTitle:'To All the Teachers Who Have Taught Us',
      letterSub:'Thank You for Accompanying Us Throughout 2024–2026',
      sign:'2024–2026, respectfully and gratefully, your students.',
      cta:'Open our teachers’ thank-you letter',
      close:'Close the envelope',
      scrollHint:'Scroll down to read the whole letter',
      readLabel:'Listen to the letter', readPause:'Pause reading', readNoAudio:'No audio for this language yet',
      noticeTitle:'Please note',
      noticeBody:'This audio was generated by artificial intelligence (AI). The narration, pronunciation or pauses may differ slightly from the original text. If there is any discrepancy, please refer to the original written text. Thank you for your understanding.',
      noticeSkip:'Don’t show this reminder again',
      noticeCancel:'Cancel', noticeOk:'Got it, play',
      musicPlay:'Play background music', musicPause:'Pause background music', musicNone:'No background music configured',
      body:[
        'Dear Teachers,',
        'We hope this letter finds you well.',
        'As we write this letter, there are so many things we want to say, yet we do not know where to begin. Looking back on our journey from Form 1 to Form 3, we realise that these three years are truly worth remembering and cherishing. It turns out that three years can pass so quickly. Before we even had the chance to treasure every moment, we had already reached the end of our lower secondary school life.',
        'When we thought we still had plenty of time, we suddenly realised that the time we had left was not much at all. The days we once thought would repeat themselves forever—going to class, leaving class, being reminded by teachers, and fooling around with our classmates—have now become the memories we find hardest to let go of.',
        'When we were in Form 1, we were still the “little angels” everyone talked about. Back then, we were polite, greeted our teachers voluntarily, and knew how to show respect. Because of that, we received quite a lot of praise from our teachers. At that time, we were perhaps still a little inexperienced, full of expectations for the secondary school life ahead of us, and had not yet fully revealed our true “potential”.',
        'However, as time slowly passed, it seemed that we began to change.',
        'By Form 2, we gradually transformed from “little angels” into “little devils”. The strange comments that occasionally slipped out during lessons, the things we did that left our teachers laughing and shaking their heads, and the endless little incidents all made our class livelier and livelier. By Form 3, we had completely let ourselves loose, as though we were releasing all the energy we had stored up since Form 1 at once. We ate during lessons, shouted and made a lot of noise, and sometimes the whole classroom was practically like Sun Wukong causing havoc in Heaven. Looking back, we truly admire our teachers for being able to accompany such an increasingly mischievous group of students throughout these three years.',
        'Throughout these three years, people came and went, and the faces around us kept changing, but the stories belonging to our class never stopped. Some new classmates joined us, while others left. Some new teachers entered our classrooms, while some teachers who had taught us eventually left the school. Even though some teachers no longer teach us and some familiar faces can now only be found in our memories, the fact that you once taught us will never change with the passing of time. Whether you accompanied us for a long time or only briefly, you have already become part of our secondary school life.',
        'When it comes to the memories of our class, there are truly far too many stories worth sharing.',
        'We still remember a girl who, from Form 1 to Form 2, would always repeat the same words: “Teacher, I want to eat a chicken drumstick! Teacher, I want to eat a chicken drumstick!” Looking back now, that sentence has practically become one of our class’s unique memories. Perhaps she said it casually at the time, but it is precisely these seemingly ordinary, and sometimes rather ridiculous, little moments that made our school life so interesting.',
        'Then there was our charity sale. Everyone made quite a lot of preparations for the event. During that period, we worked hard together towards a common goal and completed a task that belonged to our class. Looking back, the charity sale was more than just an activity. It was proof that we had worked hard and cooperated with one another. Perhaps at the time, we were too busy trying to get everything done properly to realise that these shared experiences would one day become precious memories of our youth.',
        'Of course, our class was not well-behaved every single day.',
        'During a History lesson in Form 2, someone once made our History teacher so angry that the teacher became visibly upset. Looking back, we realise that we really were too fond of fooling around sometimes. We often cared too much about our own enjoyment and forgot that teachers also had to maintain classroom discipline and had feelings of their own. Even though we sometimes gave our History teacher a headache, the teacher continued to tolerate us and patiently guide us time and time again. Thank you for not giving up on us easily because of our mischievous behaviour. Thank you also for continuing to teach us even after becoming angry with us.',
        'By Form 3, our level of mischief seemed to rise to another level.',
        'As soon as the recess bell rang, our classroom seemed to turn into a completely different world. We would often gather around the teacher’s desk without even planning to do so. One after another, we would crowd around it. Some would sit down, while others would take out their food. We would gather there to eat, chat, joke around and laugh together. Even though the teacher was not there, it was we, the students, who occupied the area around the teacher’s desk. We even ate directly on the teacher’s desk.',
        'From a distance, the scene looked as though we were holding some kind of important meeting. Everyone seemed to have an opinion to express and something to discuss. We gathered in a big group, making the place incredibly lively and noisy. Although it was only recess and we were simply eating together, we somehow managed to create the atmosphere of a meeting where representatives from every part of the class had gathered to discuss major matters.',
        'This was also why our class came to be known as the “United Nations”. By Form 3, many students from other classes would walk straight into our classroom and join our lively “meetings”. What had originally been a space belonging to our class became a little “United Nations” because of all the students coming and going. Sometimes, watching everyone gather around the teacher’s desk to eat, chat and fool around really felt like watching a meeting that would never end.',
        'The teacher’s desk was originally a place for the teacher to use while teaching. However, in our class, it seemed to have become the “United Nations Conference Hall”. We students were the representatives who attended the meeting on time every day. Perhaps at the time, we simply thought it was fun to gather together like that. But looking back now, those moments of eating, chatting and fooling around together have become some of the most vivid memories of our Form 3 life.',
        'From Form 2 to Form 3, other classes even gave us a special nickname: the “open-source hub for lame jokes”. We do not know who contributed so many lame jokes that we earned such a reputation. But since the nickname has already spread, it seems our class really did have its own “sense of humour”.',
        'There was also the girl whose voice was exceptionally loud. Every time she opened her mouth, her volume was so exaggerated that it seemed as though she could shatter everyone’s eardrums. Whenever something like that happened, the whole class would have another moment that left us not knowing whether to laugh or shake our heads. Looking back now, those noisy and chaotic scenes have also become part of the memories we find difficult to let go of.',
        'There was also one Friday that still feels crazy whenever we think about it.',
        'Since the next day was Saturday and we could finally rest, everyone became incredibly excited before school ended. People shouted loudly in the classroom, and some even threw things around, leaving the whole class in chaos. At that moment, everyone seemed unable to wait to rush out of school and enjoy their well-deserved rest. Looking back, we really could become that excited just because a break was coming. Meanwhile, our teachers still had to work hard to maintain classroom discipline on days like these. You truly had a difficult time dealing with us.',
        'At this point, we also have to give special thanks to our Mathematics teacher.',
        'Dear Mathematics teacher, thank you for your patience and understanding throughout all this time. We know that we have not always been the easiest students to teach. Sometimes, even when we had already made you angry, you would still continue standing at the front of the classroom, teaching seriously and explaining the questions in the hope that we would understand and learn.',
        'However, there is one incident that still makes us feel sad whenever we think about it.',
        'On one occasion, a girl had a conflict with our Mathematics teacher. Every time the teacher said something, she would talk back. Their words continued back and forth, and the atmosphere became increasingly tense. Perhaps at the time, we did not truly realise how serious the situation was. Some of us may have simply stood by and watched, never imagining that the argument would make the teacher so upset.',
        'In the end, the teacher could no longer hold back the tears.',
        'When the teacher angrily closed the door and left, our once noisy classroom suddenly fell completely silent. Just moments earlier, we had been laughing and making a lot of noise, but suddenly it was as though everyone had lost their voice. Only then did we slowly begin to realise that this was no longer just an ordinary disagreement or a normal classroom conflict.',
        'We realised that the teacher who usually stood at the front of the classroom teaching us Mathematics and patiently explaining questions could also feel hurt by our words and actions. Teachers have feelings too, and there are times when even they cannot bear everything any longer.',
        'At that time, two boys and three girls were among the first to realise that the teacher was genuinely upset. Later, another classmate took the initiative to approach the teacher and say, “I’m sorry.”',
        'Perhaps that apology could not immediately make all the sadness disappear, but at least we hoped it would let the teacher know that we did care about your feelings. Maybe we were not mature enough at the time and did not know how to express our emotions properly. We also did not understand that talking back or saying something without thinking could hurt another person.',
        'Dear Mathematics teacher, we are sorry.',
        'We are sorry for all the times we acted immaturely. We are sorry that sometimes we were too busy arguing and defending ourselves that we forgot to listen to you properly. Every day, you stood at the front of the classroom and worked hard to teach us, hoping that we would learn and improve. Yet sometimes, we failed to give you the respect you deserved.',
        'Thank you for continuing to teach us patiently, even after we had made you so angry and upset. Thank you for not giving up on teaching us because of that one conflict. We know that you did not only want us to learn how to solve Mathematics questions. You also wanted us to learn how to respect others, take responsibility for our actions, and communicate properly when disagreements occurred.',
        'Perhaps we did not say these words at the time, but now we sincerely want to thank you and apologise to you.',
        'We hope that when you think of our class in the future, you will remember more than just the days when we gave you a headache. We hope you will also remember that we eventually recognised our immaturity, that we tried to apologise to you, and that we gradually learned to understand your hard work and dedication as we grew up.',
        'We do not want the only thing you remember about us to be a group of students who once made you sad. We hope you will remember us as a group of children who were not yet mature enough, who sometimes made mistakes, but who were also slowly growing up.',
        'We will also remember that we once had a Mathematics teacher who, even when we made you upset, continued to teach us sincerely and wholeheartedly.',
        'Thank you, Mathematics teacher.',
        'Our Science teacher, who was also our class teacher, was another important person who accompanied us throughout these three years.',
        'Whenever we became too mischievous or did something that required the teacher to take matters seriously, the teacher would always say one sentence: “We are one class.”',
        'The sentence may sound simple, but looking back now, we realise that it carries a much deeper meaning. Because we are one class, we should not only think about ourselves. Because we are one class, we should learn to understand and tolerate one another, and take responsibility for our own behaviour. A class cannot be free of problems all the time, and not everyone will have the same personality. However, as long as we are willing to put ourselves in one another’s shoes, we can become better together.',
        'Thank you for reminding us when we became too mischievous, taking matters seriously when we needed discipline, and allowing us to play games in class. Because of that, learning was not limited to textbooks, homework and examinations. Those laughter-filled lessons gave us some relaxing and happy moments amid our busy school lives.',
        'Perhaps many years from now, we will not remember every question we once answered, but we will probably remember the lessons that made the whole class laugh. We will also remember the teacher’s words: “We are one class.”',
        'We would also like to thank our Bahasa Melayu teacher for always teaching us seriously and wholeheartedly. Thank you for taking the time to explain things and guide us so that we could improve little by little throughout our learning journey. We noticed your dedication and effort. Even when we could not immediately do our best, thank you for not losing patience with us and for continuing to guide us forward.',
        'To our Chinese Language teacher, thank you for sharing so many classroom moments with us. We always seemed to find a way to make you laugh. Sometimes, even we ourselves did not know which sentence or reaction had made you laugh. Looking back now, being able to share this kind of interaction with a teacher in the classroom is truly something special.',
        'Thank you for making Chinese Language lessons more than just a place to learn writing and knowledge. You also left us with many warm and light-hearted memories. Perhaps we once said something in class that made you burst out laughing, or perhaps we made an ordinary lesson much livelier. These seemingly ordinary little moments have now become precious memories in our hearts.',
        'We would also like to express our special thanks to all the English teachers who taught us from Form 1 to Form 3.',
        'Although our English teachers changed several times throughout these three years, we still want to thank every English teacher who has ever taught us. Thank you for teaching us and for all the effort you put into guiding us during that time.',
        'Especially in Form 3, our English lessons were extremely chaotic. Sometimes, some students simply refused to listen to what the teacher said and even shouted and made a scene in front of everyone in the classroom. Looking back now, we realise that our behaviour was not always appropriate, and we may have caused our English teachers to feel frustrated and helpless.',
        'No matter how many times our English teachers changed throughout these three years, we would still like to take this opportunity to thank every English teacher who has taught us. Thank you for coming into our classroom to teach and guide us. Thank you also for the time and effort you devoted to us. Even if some of you no longer teach us, we will still remember that you were once our teachers.',
        'Of course, there are many other teachers who have taught us as well.',
        'Perhaps you were once angry because of our behaviour. Perhaps you sometimes felt helpless when dealing with us. Perhaps there were times when you had already decided to discipline us strictly, but in the end, you still softened your approach out of kindness.',
        'Thank you for giving us opportunities, accepting our immaturity and continuing to remind us and correct us whenever we did something wrong. We know that a teacher being kind and forgiving does not mean that we can behave however we want. Rather, even while setting rules and disciplining us, you still care about us.',
        'Thank you for continuing to believe that we can learn and grow after making mistakes.',
        'Looking back, our lives throughout these three years always seemed to be filled with noise, laughter, jokes and moments that occasionally gave our teachers a headache. Sometimes we were too excited. Sometimes we were not mature enough. Sometimes we even forgot that teachers also need to be understood and respected.',
        'However, because of your guidance and patience, we were able to grow little by little through every experience we went through.',
        'Perhaps we will not remember the content of every lesson, and perhaps we will not achieve good results in every examination. Perhaps we have disappointed you and made you worry about us. But please believe that the time, effort and dedication you invested in us were not meaningless.',
        'Besides the knowledge in our textbooks, you also taught us how to get along with others, how to face our mistakes, how to take responsibility for our actions, and how to learn understanding and tolerance as part of a group.',
        'The reminders that once seemed ordinary, the advice that sometimes made us feel annoyed, and even the stern scoldings that once frightened us have gradually taken on a different meaning as we look back today.',
        'Teachers, as we write this letter, we finally realise how short three years really are.',
        'They are so short that before we could remember every single day clearly, we had already reached the end of our lower secondary school life. The teachers we used to see every day, the classrooms we had grown accustomed to, and the lessons and breaks we once thought would never end now carry a different meaning.',
        'When we think about all this, we truly feel a little reluctant to move on.',
        'We will miss the familiar voices, the noisy everyday moments, and the companionship we once took for granted.',
        'It turns out that youth is not only about grand and extraordinary events. More often, it is about ordinary days spent with a group of people, the sight of teachers teaching at the front of the classroom, the sound of laughter echoing throughout the room, and the little moments we did not pay much attention to at the time but now wish we could treasure properly.',
        'Actually, we know that after moving up to Form 4, we will still have opportunities to see you at school.',
        'We may still bump into you in the corridors, greet you when passing your classroom, and occasionally stop to have a short conversation with you. Perhaps the next time we meet, we will still smile and greet you, and might even joke around with you as we used to.',
        'Therefore, this is not a letter of farewell forever.',
        'We simply want to take this opportunity, while the story of our three years in lower secondary school has not yet completely become a thing of the past, to tell you sincerely: thank you.',
        'Even though we may still see you in the future, that does not mean we can continue spending every day in the same classroom as before, listening to your lessons, being reminded by you, making noise during recess, and then returning to class the next day as though nothing had happened.',
        'In the future, we may still walk along the same corridors and see the same familiar faces, but we will no longer be the same class that once sat in your classrooms.',
        'Perhaps one day, you will walk into a classroom and see a new group of students sitting in the seats that once belonged to us. Perhaps on another day, you will meet another mischievous class and find yourselves thinking of us again.',
        'We wonder whether, at that time, you will still remember that there was once a class that was like “little angels” in Form 1, slowly turned into “little devils” in Form 2, and became so noisy in Form 3 that it left people not knowing whether to laugh or shake their heads.',
        'Will you remember the girl who always shouted that she wanted to eat chicken drumsticks?',
        'Will you remember the class that other classes called the “open-source hub for lame jokes”?',
        'Will you remember the students crowding around the teacher’s desk during recess, as though they were holding an important “United Nations meeting” every day?',
        'Will you remember the class that shouted and screamed wildly before school ended on Friday because we could finally have a break?',
        'Or will you remember a particular lesson when you were already extremely frustrated with us, yet still held back your emotions and continued standing at the front of the classroom to finish teaching the lesson properly?',
        'Teachers, perhaps you have taught many generations of students and met all kinds of classes. To you, we may simply be one of the many groups of students you have taught throughout your teaching career. Three years from now, new students will enter your classrooms, and new stories will continue to unfold.',
        'However, to us, you are the people who were truly present in our lives and accompanied us throughout these three years of lower secondary school.',
        'You watched us grow from Form 1, go through the changes of Form 2, and finally reach Form 3. You saw us at our most polite, and you also saw us at our most mischievous and troublesome. Perhaps we disappointed you at times, but perhaps you also felt happy when you saw us improve.',
        'These things may simply be part of your daily work, but to us, they are moments in our lives that can never be repeated in exactly the same way.',
        'We are not writing this letter because we want you to think that we are exceptionally outstanding students, nor are we asking you to forget the mistakes we once made.',
        'We simply hope that many years from now, when you occasionally think back to the years 2024 to 2026, you will remember that you once taught a class like ours.',
        'A class that was not perfect, but had many stories to tell.',
        'A class that could make you angry and leave you feeling helpless, yet would also feel sad upon realising that you were hurt.',
        'A class that might not have made you proud every single day, but was truly grateful to you.',
        'Perhaps we could not always meet your expectations, and perhaps our examination results did not always make every teacher proud. Nevertheless, we hope that when you look back on these days in the future, you will know that your place in our hearts will never change because of our grades, the passing of time, or how far we eventually go in life.',
        'If there was ever a time when our behaviour made you sad, please forgive us for being immature at that time. If there was ever a reminder from you that we failed to take seriously, we hope you will know that we are slowly growing up and learning to understand the things we did not understand before.',
        'Perhaps we still cannot fully understand how difficult a teacher’s job can be. Perhaps we still do not know how to express our gratitude in the most beautiful words. But at least, as our three years of lower secondary school come to an end, we want to offer you our appreciation sincerely and wholeheartedly.',
        'Thank you for not stopping teaching us just because we were not perfect.',
        'Thank you for reminding us when we made mistakes, patiently explaining things when we did not understand, and continuing to give us opportunities even when we gave you a headache.',
        'Thank you for helping us understand that what a teacher leaves behind for students is not only knowledge from textbooks, but also those moments that can still warm our hearts when we remember them many years later.',
        'Teachers, we will still see you around school in the future.',
        'So, the next time we meet, we may not say many touching words. We might simply smile and greet you as we usually do.',
        'However, if one day you suddenly think of us, remember the seats we once occupied, remember that noisy classroom, and remember the days when we made you both angry and helpless, we hope you will also remember that behind all the noise was a group of students who were truly grateful to you.',
        'We will continue to grow up and move towards our own futures.',
        'You, on the other hand, will continue teaching new students, standing at the front of your classrooms, and becoming teachers who guide many students along their journeys of growth.',
        'We simply hope that among all the generations of students you have taught, we can be one of those classes that occasionally comes to mind and makes you smile a little whenever you remember us.',
        'Thank you for accompanying us throughout 2024 to 2026.',
        'The things we experienced together during these three years may not have been extraordinary events that shook the world, but they are memories that belong only to our class, memories shared between you and us.',
        'We are grateful that we had the chance to become your students.',
        'We are also grateful that, at a time when we were still immature and did not yet understand many things, we met teachers who were willing to guide us patiently.',
        'Although we may not be your most outstanding students, you are the teachers we respect the most.',
        'For all the years ahead, we wish you happiness, joy, peace and good health.',
        'May every day ahead bring you less exhaustion and more laughter. May the patience and care you have given to your students be returned to you through kindness and warmth in your own lives.',
        'We also hope that one day, when you remember our class, what comes to mind will not simply be how noisy and mischievous we were, but the days we spent together and the fact that we grew up in your classrooms.',
        'Thank you, our teachers.',
        'This time, we truly want to say it sincerely.',
        'We are not saying goodbye to you forever. We simply want to take this opportunity, as we leave lower secondary school, to tell you properly: being your students has been one of the most precious experiences of our youth.'
      ]
