<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>致最敬爱的老师 · 毕业感谢信</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+Tamil:wght@400;600;700&family=Noto+Sans+Tamil:wght@300;400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#fff3e4;
    --sky-2:#fbd2a8;
    --sky-3:#e99a9e;
    --sky-4:#a06382;
    --sky-5:#5c3f5c;
    --gold:#cf9a4c;
    --gold-light:#f1d9a6;
    --paper:#fbf4e6;
    --paper-deep:#f2e6cd;
    --ink:#5b4636;
    --ink-soft:#8a7461;
    --silhouette:#42324a;
    --shadow:rgba(74,42,58,.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100svh;
    overflow-x:hidden;
    font-family:"Noto Sans SC","Noto Sans Tamil","PingFang SC",sans-serif;
    background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 32%,var(--sky-3) 62%,var(--sky-4) 84%,var(--sky-5) 100%);
    color:var(--ink);
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Ambient light sweep ---------- */
  .sunbeam{
    position:fixed;
    inset:-20% -20% auto -20%;
    height:140%;
    background:conic-gradient(from 200deg at 50% 0%,
      rgba(255,244,214,0) 0deg,
      rgba(255,244,214,.55) 8deg,
      rgba(255,244,214,0) 22deg,
      rgba(255,244,214,0) 40deg,
      rgba(255,244,214,.35) 50deg,
      rgba(255,244,214,0) 65deg,
      rgba(255,244,214,0) 100deg,
      rgba(255,244,214,.4) 112deg,
      rgba(255,244,214,0) 130deg,
      rgba(255,244,214,0) 360deg);
    mix-blend-mode:soft-light;
    animation:rotateBeam 60s linear infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes rotateBeam{ to{ transform:rotate(360deg); } }

  /* ---------- Floating light particles ---------- */
  .particles{
    position:fixed; inset:0; overflow:hidden; z-index:2; pointer-events:none;
  }
  .particle{
    position:absolute;
    bottom:-5%;
    width:6px;height:6px;
    border-radius:50%;
    background:radial-gradient(circle,#fff6df 0%,rgba(255,246,223,0) 70%);
    opacity:.8;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translate(0,0) scale(1); opacity:0; }
    10%{ opacity:.85; }
    50%{ transform:translate(var(--drift,20px),-55vh) scale(1.1); }
    90%{ opacity:.4; }
    100%{ transform:translate(calc(var(--drift,20px) * 2),-110vh) scale(.6); opacity:0; }
  }

  /* ---------- Campus silhouette ---------- */
  .campus{
    position:fixed; left:0; right:0; bottom:0; width:100%;
    height:min(28vh,220px);
    z-index:3; pointer-events:none;
  }
  .campus svg{ width:100%; height:100%; display:block; }
  .campus path{ fill:var(--silhouette); opacity:.85; }

  /* ---------- Paper airplanes ---------- */
  .plane{
    position:fixed; top:-40px; z-index:4; pointer-events:none;
    opacity:.75; filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));
    animation:planeFly linear infinite;
  }
  .plane svg{ width:34px; height:34px; display:block; }
  .plane.p1{ left:8%;  top:12%; animation-duration:22s; animation-delay:1s; }
  .plane.p2{ left:70%; top:60%; animation-duration:28s; animation-delay:6s; transform:scale(.8) rotate(20deg); }
  .plane.p3{ left:-10%; top:35%; animation-duration:26s; animation-delay:12s; transform:scale(.65); }
  @keyframes planeFly{
    0%{ transform:translate(0,0) rotate(-8deg); opacity:0; }
    8%{ opacity:.75; }
    50%{ transform:translate(48vw,-6vh) rotate(4deg); }
    92%{ opacity:.55; }
    100%{ transform:translate(112vw,-14vh) rotate(-4deg); opacity:0; }
  }

  /* ---------- Drifting graduation caps ---------- */
  .cap-drift{
    position:fixed; z-index:4; pointer-events:none; opacity:.5;
    animation:capFloat ease-in-out infinite;
  }
  .cap-drift svg{ width:26px; height:26px; }
  .cap-drift.c1{ left:18%; top:70%; animation-duration:9s; }
  .cap-drift.c2{ left:82%; top:22%; animation-duration:11s; animation-delay:2s; }
  @keyframes capFloat{
    0%,100%{ transform:translateY(0) rotate(-6deg); }
    50%{ transform:translateY(-22px) rotate(6deg); }
  }

  /* ---------- Music toggle ---------- */
  .music-toggle{
    position:fixed; right:max(18px,env(safe-area-inset-right));
    bottom:max(18px,env(safe-area-inset-bottom));
    z-index:20;
    width:48px; height:48px; border-radius:50%;
    border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(90,55,45,.18);
    transition:transform .25s ease, background .25s ease;
  }
  .music-toggle:hover{ transform:scale(1.08); }
  .music-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .music-toggle svg{ width:20px; height:20px; color:var(--ink); }
  .music-toggle .bar{ transform-origin:bottom; transition:transform .3s ease; }
  .music-toggle.playing .bar1{ animation:eq 1s ease-in-out infinite; }
  .music-toggle.playing .bar2{ animation:eq 1s ease-in-out infinite .2s; }
  .music-toggle.playing .bar3{ animation:eq 1s ease-in-out infinite .4s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.4); } 50%{ transform:scaleY(1); } }

  /* ---------- Stage ---------- */
  .stage{
    position:relative; z-index:10;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8vh 5vw;
  }

  .headline{
    text-align:center;
    font-family:"Noto Serif SC","Noto Serif Tamil",serif;
    font-weight:500;
    letter-spacing:.06em;
    color:var(--ink);
    opacity:.85;
    font-size:clamp(15px,2.4vw,19px);
    margin:0 0 clamp(24px,5vh,48px);
    transition:opacity .6s ease;
  }
  .stage.is-opening .headline,
  .stage.is-closing .headline{ opacity:0; height:0; margin:0; }

  /* ---------- Envelope ---------- */
  .envelope-wrap{
    position:relative;
    width:clamp(230px,62vw,360px);
    aspect-ratio:3/2;
    perspective:1400px;
    transform:translateY(-160vh);
    animation:dropIn 1.4s cubic-bezier(.22,1.4,.36,1) forwards;
    animation-delay:.3s;
  }
  @keyframes dropIn{
    0%{ transform:translateY(-160vh) rotate(-4deg); }
    62%{ transform:translateY(6%) rotate(1.5deg); }
    78%{ transform:translateY(-2.5%) rotate(-.8deg); }
    90%{ transform:translateY(1%) rotate(.4deg); }
    100%{ transform:translateY(0) rotate(0deg); }
  }

  .envelope-wrap.is-flying-out{
    animation:flyOut 1.2s cubic-bezier(.55,-.15,.75,.25) forwards;
  }
  @keyframes flyOut{
    0%{ transform:translate(0,0) rotate(0) scale(1); opacity:1; }
    18%{ transform:translate(3vw,-3vh) rotate(4deg) scale(1.03); opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translate(-85vw,85vh) rotate(-32deg) scale(.6); opacity:0; }
  }

  .envelope-wrap.is-flying-in{
    animation:flyIn 1.6s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes flyIn{
    0%{ transform:translate(85vw,-85vh) rotate(24deg) scale(.7); opacity:0; }
    12%{ opacity:1; }
    62%{ transform:translate(-2%,4%) rotate(-2deg) scale(1.01); }
    78%{ transform:translate(1%,-2%) rotate(.8deg) scale(1); }
    90%{ transform:translate(-.4%,.8%) rotate(-.3deg); }
    100%{ transform:translate(0,0) rotate(0) scale(1); opacity:1; }
  }

  .envelope{
    position:absolute; inset:0;
    filter:drop-shadow(0 18px 30px var(--shadow));
    transition:filter .6s ease;
  }
  .stage.is-opening .envelope,
  .stage.is-open .envelope{ filter:drop-shadow(0 6px 14px var(--shadow)); }

  .pocket{
    position:absolute; inset:0;
    background:linear-gradient(160deg,#e9d09a 0%,#cfa663 100%);
    border-radius:6px;
    box-shadow:inset 0 12px 24px rgba(90,55,20,.32), inset 0 0 0 1px rgba(207,154,76,.35);
    z-index:1;
  }

  /* front lower panel: hides the letter while it is still "inside" the envelope */
  .pocket-front{
    position:absolute; left:0; right:0; bottom:0; top:52%;
    background:linear-gradient(180deg,var(--paper) 0%,var(--paper-deep) 100%);
    border-radius:0 0 6px 6px;
    box-shadow:inset 0 0 0 1px rgba(207,154,76,.35), 0 -1px 4px rgba(90,60,40,.1);
    z-index:3;
    overflow:hidden;
  }
  .pocket-front::before, .pocket-front::after{
    content:""; position:absolute; top:0; width:52%; height:100%;
    background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);
    opacity:.55;
  }
  .pocket-front::before{ left:0; clip-path:polygon(0 0,100% 0,0 100%); }
  .pocket-front::after{ right:0; clip-path:polygon(100% 0,100% 100%,0 0); transform:scaleX(-1); }

  .flap{
    position:absolute; top:0; left:0; right:0;
    height:62%;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(160deg,var(--gold-light) 0%,var(--paper) 55%,var(--paper-deep) 100%);
    transform-origin:50% 0%;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.6,.05,.2,1), z-index 0s .35s;
    z-index:4;
    box-shadow:inset 0 -6px 10px -6px rgba(90,60,40,.25);
  }
  .stage.is-opening .flap,
  .stage.is-open .flap{
    transform:rotateX(-172deg);
    z-index:0;
  }

  .seal{
    position:absolute; left:50%; top:34%;
    width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e8bd6c,var(--gold) 60%,#a97a2f 100%);
    box-shadow:0 3px 8px rgba(90,55,20,.4), inset 0 -2px 4px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    transition:transform .5s ease, opacity .5s ease;
  }
  .seal svg{ width:26px; height:26px; color:#fff8ea; opacity:.95; }
  .stage.is-opening .seal,
  .stage.is-open .seal{
    transform:scale(.4) rotate(35deg);
    opacity:0;
  }

  /* ---------- Letter ----------
     The slot is a clipping window whose bottom edge sits on the pocket's
     opening line, so the letter is only visible once it has been pulled
     above that line — like drawing a real letter out of an envelope. */
  .letter-slot{
    position:absolute; left:0; right:0; bottom:48%;
    height:300vh;
    overflow:hidden;
    z-index:2;
    pointer-events:none;
  }
  .letter{
    position:absolute; left:8%; bottom:0;
    width:84%;
    aspect-ratio:1.6;
    background:
      repeating-linear-gradient(180deg,transparent 0,transparent 34px,rgba(207,154,76,.12) 35px),
      linear-gradient(170deg,#fffaf0,var(--paper) 70%);
    border-radius:3px;
    box-shadow:0 10px 24px -10px rgba(74,42,58,.35), 0 1px 4px rgba(74,42,58,.12);
    overflow:hidden;
    transform:translateY(102%);
    transition:transform 1.4s cubic-bezier(.45,.05,.3,1);
  }
  /* crease of the folded letter */
  .letter::after{
    content:""; position:absolute; left:0; right:0; top:50%; height:10px; margin-top:-5px;
    background:linear-gradient(180deg,rgba(150,110,70,0),rgba(150,110,70,.14) 50%,rgba(255,255,255,.6) 55%,rgba(150,110,70,0));
    transition:opacity .6s ease;
    pointer-events:none;
  }
  .stage.is-rising .letter{ transform:translateY(-78%); }

  .letter.is-floating{
    position:fixed; bottom:auto;
    aspect-ratio:auto;
    transform:none;
    z-index:15;
    box-shadow:0 26px 54px -14px rgba(74,42,58,.4), 0 2px 8px rgba(74,42,58,.15);
    transition:left 1s cubic-bezier(.22,1,.36,1), top 1s cubic-bezier(.22,1,.36,1),
               width 1s cubic-bezier(.22,1,.36,1), height 1s cubic-bezier(.22,1,.36,1),
               box-shadow 1s ease;
  }
  .letter.is-unfolding::after{ opacity:0; }
  .letter.is-revealed{ overflow-x:hidden; overflow-y:auto; }

  .letter-inner{
    width:var(--final-w,340px);
    padding:clamp(22px,5vw,40px) clamp(20px,5vw,36px) clamp(26px,5vw,40px);
  }

  /* While folded / rising, the sheet is narrow — centre the text on its own
     width instead of on the wider reading width used once it floats. */
  .letter:not(.is-floating) .letter-inner{ width:100%; }

  /* Malay, English and Tamil run longer than the Chinese original: tighter
     leading and a slightly smaller size so the whole letter still fits on one
     screen. Tamil keeps a little more leading for its ascenders/descenders. */
  html[lang="ms"] .letter-body p,
  html[lang="en"] .letter-body p{ font-size:clamp(12.8px,2.4vw,14.8px); line-height:1.72; }
  html[lang="ta"] .letter-body p{ font-size:clamp(12.5px,2.3vw,14.5px); line-height:1.9; }
  html[lang="ta"] .letter-title{ font-size:clamp(18px,3.4vw,23px); }
  html[lang="ms"] .letter-sign,
  html[lang="en"] .letter-sign,
  html[lang="ta"] .letter-sign{ font-size:clamp(16px,3vw,20px); }

  .letter-title{
    font-family:"Noto Serif SC","Noto Serif Tamil",serif;
    font-weight:700;
    font-size:clamp(20px,4vw,26px);
    text-align:center;
    color:var(--ink);
    letter-spacing:.04em;
    margin:0 0 clamp(16px,3vh,24px);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .letter-title::before,.letter-title::after{
    content:"";
    display:block;
    width:28px; height:1px;
    background:var(--gold);
    margin:10px auto;
    opacity:.7;
  }

  /* Subtitle line from the letter's own opening sentence */
  .letter-sub{
    font-family:"Noto Serif SC","Noto Serif Tamil",serif;
    font-size:clamp(12.5px,2.3vw,14.5px);
    text-align:center;
    color:var(--gold);
    letter-spacing:.06em;
    margin:-4px 0 clamp(16px,3vh,24px);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .9s ease, transform .9s ease;
  }

  /* The letter is long, so the whole body fades in as one block and the sheet
     scrolls; per-paragraph staggering would never finish. */
  .letter-body{
    opacity:0;
    transform:translateY(8px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .letter-body p{
    font-family:"Noto Serif SC","Noto Serif Tamil",serif;
    font-weight:400;
    font-size:clamp(13.5px,2.6vw,15.5px);
    line-height:2;
    color:var(--ink);
    margin:0 0 1.1em;
  }

  .letter-sign{
    font-family:"Ma Shan Zheng","Noto Serif Tamil",cursive;
    font-size:clamp(18px,3.4vw,22px);
    color:var(--gold);
    text-align:right;
    margin-top:1.4em;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .9s ease, transform .9s ease;
  }

  .letter.is-revealed .letter-title{ transition-delay:.1s; opacity:1; transform:none; }
  .letter.is-revealed .letter-sub{ transition-delay:.25s; opacity:1; transform:none; }
  .letter.is-revealed .letter-body{ transition-delay:.4s; opacity:1; transform:none; }
  .letter.is-revealed .letter-sign{ transition-delay:.55s; opacity:1; transform:none; }

  /* ---------- CTA ---------- */
  .cta{
    margin-top:clamp(28px,7vh,52px);
    background:none; border:none; cursor:pointer;
    font-family:"Ma Shan Zheng","Noto Serif SC","Noto Serif Tamil",cursive;
    font-size:clamp(17px,2.8vw,21px);
    color:var(--ink);
    letter-spacing:.08em;
    padding:10px 22px;
    position:relative;
    animation:breathe 2.6s ease-in-out infinite;
    transition:opacity .5s ease, transform .5s ease;
    opacity:1;
    animation-delay:1.9s;
  }
  .cta::after{
    content:"";
    position:absolute; left:50%; bottom:2px; width:0%; height:1px;
    background:var(--gold);
    transform:translateX(-50%);
    transition:width .4s ease;
  }
  .cta:hover::after{ width:70%; }
  .cta:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; border-radius:4px; }
  @keyframes breathe{
    0%,100%{ opacity:.65; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.045); }
  }
  .stage.is-opening .cta,
  .stage.is-closing .cta,
  .stage.is-away .cta{
    opacity:0; transform:scale(.9);
    pointer-events:none;
    animation:none;
  }

  /* ---------- Close ---------- */
  .close-btn{
    position:fixed; left:50%; top:0;
    transform:translate(-50%,6px);
    z-index:16;
    font-family:"Noto Sans SC","Noto Sans Tamil",sans-serif;
    font-size:13px; letter-spacing:.12em;
    color:var(--ink-soft);
    background:rgba(255,250,240,.88);
    border:1px solid rgba(207,154,76,.45);
    border-radius:999px;
    padding:6px 16px;
    backdrop-filter:blur(6px);
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease, transform .5s ease, color .25s ease, border-color .25s ease;
  }
  .close-btn.is-visible{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  .close-btn:hover{ color:var(--ink); border-color:var(--gold); }
  .close-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  /* ---------- Scroll hint (the letter is long) ---------- */
  .scroll-hint{
    position:fixed;
    z-index:17;
    text-align:center;
    font-family:"Noto Sans SC","Noto Sans Tamil",sans-serif;
    font-size:12px; line-height:1.5; letter-spacing:.1em; white-space:nowrap;
    color:var(--ink-soft);
    padding:46px 12px 12px;
    background:linear-gradient(180deg,
      rgba(251,244,230,0) 0%,
      rgba(251,244,230,.5) 20%,
      rgba(251,244,230,.95) 44%,
      var(--paper) 100%);
    border-radius:0 0 6px 6px;
    pointer-events:none;
    opacity:0;
    transition:opacity .6s ease;
  }
  .scroll-hint.is-visible{ opacity:1; }
  .scroll-hint .arrow{ display:block; margin-top:2px; font-size:13px; animation:nudge 1.6s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{ transform:translateY(0); opacity:.55; } 50%{ transform:translateY(4px); opacity:1; } }

  .letter.is-hiding-text .letter-title,
  .letter.is-hiding-text .letter-sub,
  .letter.is-hiding-text .letter-body,
  .letter.is-hiding-text .letter-body p,
  .letter.is-hiding-text .letter-sign{ transition-duration:.45s; }

  /* ---------- Language switcher ---------- */
  .lang-switch{
    position:fixed;
    left:max(14px,env(safe-area-inset-left));
    top:max(14px,env(safe-area-inset-top));
    z-index:30;
    display:flex; align-items:center; gap:4px;
    padding:4px;
    background:rgba(255,250,240,.72);
    border:1px solid rgba(207,154,76,.42);
    border-radius:999px;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 14px rgba(90,55,45,.12);
  }
  .lang-btn{
    border:none; background:none; cursor:pointer;
    font-family:"Noto Sans SC","Noto Sans Tamil",sans-serif;
    font-size:12.5px; line-height:1; letter-spacing:.03em;
    color:var(--ink-soft);
    padding:7px 12px; border-radius:999px;
    transition:background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .lang-btn:hover{ color:var(--ink); background:rgba(207,154,76,.16); }
  .lang-btn.is-active{
    color:#fff8ea; font-weight:500;
    background:linear-gradient(160deg,var(--gold-light),var(--gold));
    box-shadow:0 2px 6px rgba(90,55,20,.28);
  }
  .lang-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Read-aloud button + progress ---------- */
  .read-btn{
    position:fixed;
    right:calc(max(18px,env(safe-area-inset-right)) + 58px);
    bottom:max(18px,env(safe-area-inset-bottom));
    z-index:20;
    display:flex; align-items:center; gap:7px;
    height:48px; padding:0 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(90,55,45,.18);
    color:var(--ink);
    font-family:"Noto Sans SC","Noto Sans Tamil",sans-serif;
    font-size:14px; letter-spacing:.04em;
    cursor:pointer; overflow:hidden;
    transition:transform .25s ease, background .25s ease, opacity .25s ease;
  }
  .read-btn:hover{ transform:scale(1.04); }
  .read-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .read-btn svg{ width:18px; height:18px; flex:none; }
  .read-btn .ri-pause{ display:none; }
  .read-btn.is-playing .ri-play{ display:none; }
  .read-btn.is-playing .ri-pause{ display:block; }
  .read-btn.is-unavailable{ opacity:.45; cursor:not-allowed; }
  .read-progress{
    position:absolute; left:0; bottom:0; height:3px; width:0%;
    background:linear-gradient(90deg,var(--gold-light),var(--gold));
    transition:width .25s linear;
  }

  /* ---------- AI voice notice ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:60;

  .modal-title{
    display:flex; align-items:center; gap:9px;

  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .modal-btn{
    font-family:"Noto Sans SC","Noto Sans Tamil",sans-serif;

  }
  .modal-btn.ghost{ background:none; border:1px solid rgba(207,154,76,.5); color:var(--ink-soft); }

  .modal-btn.primary{

    background:linear-gradient(160deg,var(--gold-light),var(--gold));

  .modal-btn.primary:hover{ transform:translateY(-1px); }
  .modal-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion:reduce){
    .sunbeam,.particle,.plane,.cap-drift,.cta,.scroll-hint .arrow{ animation:none !important; }
    .envelope-wrap{ animation:none !important; transform:none !important; }

<script>
(function(){
  var stage = document.getElementById('stage');
  var btn = document.getElementById('openBtn');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var letter = document.getElementById('letter');
  var inner = document.getElementById('letterInner');
  var slot = document.querySelector('.letter-slot');
  var envWrap = document.querySelector('.envelope-wrap');
  var closeBtn = document.getElementById('closeBtn');
  var bodyEl = document.getElementById('letterBody');
  var scrollHint = document.getElementById('scrollHint');
  var opened = false;
  var closing = false;
  function wait(ms){ return reduced ? Math.min(ms, 60) : ms; }

  function finalRect(){
    var vw = window.innerWidth, vh = window.innerHeight;
    // Latin / Tamil translations are longer than the Chinese original, so they
    // get a wider sheet and a taller ceiling; Chinese keeps the original sizes.
    var wide = currentLang !== 'zh';
    var w = Math.min(wide ? 470 : 380, Math.round(vw * 0.88));
    inner.style.setProperty('--final-w', w + 'px');
    var h = Math.min(inner.scrollHeight, Math.round(vh * (wide ? 0.88 : 0.82)));
    return { left:(vw - w) / 2, top:(vh - h) / 2, width:w, height:h };
  }

  function place(r){
    letter.style.left = r.left + 'px';
    letter.style.top = r.top + 'px';
    letter.style.width = r.width + 'px';
    letter.style.height = r.height + 'px';
  }

  function placeClose(r){
    closeBtn.style.top = Math.min(r.top + r.height + 14, window.innerHeight - 48) + 'px';
  }

  function placeHint(r){
    scrollHint.style.left = r.left + 'px';
    // keep the whole band inside the sheet, clear of the close button below it
    scrollHint.style.top = (r.top + r.height - Math.max(96, scrollHint.offsetHeight || 0)) + 'px';
    scrollHint.style.width = r.width + 'px';
  }

  // The letter is far taller than the sheet, so offer a scroll cue — but only
  // while there is actually something left to read.
  function syncHint(){
    if(!letter.classList.contains('is-revealed') || closing) return;
    if(letter.scrollHeight - letter.clientHeight > 60) scrollHint.classList.add('is-visible');
  }

  // Where the folded letter sits when it has just been pulled out of the
  // slot (mirrors .letter + .is-rising geometry).
  function pulledOutRect(){
    var s = slot.getBoundingClientRect();
    var w = s.width * 0.84;
    var h = w / 1.6;
    return { left:s.left + s.width * 0.08, top:s.bottom - h - h * 0.78, width:w, height:h };
  }

  // Once fully out of the envelope, lift the letter into a fixed layer
  // at its current on-screen rect, then unfold it to reading size.
  function liftAndUnfold(){
    var r = letter.getBoundingClientRect();
    letter.style.transition = 'none';
    document.body.appendChild(letter);
    letter.classList.add('is-floating');
    place(r);
    letter.getBoundingClientRect();
    letter.style.transition = '';
    letter.classList.add('is-unfolding');
    var target = finalRect();
    place(target);
    placeClose(target);
    placeHint(target);
    window.setTimeout(function(){ letter.classList.add('is-revealed'); }, wait(900));
    window.setTimeout(syncHint, wait(1600));
    window.setTimeout(function(){ closeBtn.classList.add('is-visible'); }, wait(3200));
  }

  btn.addEventListener('click', function(){
    if(opened) return;
    opened = true;
    stage.classList.add('is-opening');
    window.setTimeout(function(){ stage.classList.add('is-rising'); }, wait(550));
    window.setTimeout(liftAndUnfold, wait(2000));
  });

  // Reverse of opening: text out -> fold back -> slide into pocket -> flap closes.
  closeBtn.addEventListener('click', function(){
    if(closing || !letter.classList.contains('is-floating')) return;
    closing = true;
    closeBtn.classList.remove('is-visible');
    scrollHint.classList.remove('is-visible');
    letter.classList.add('is-hiding-text');
    letter.classList.remove('is-revealed');
    letter.scrollTop = 0;

    window.setTimeout(function(){
      letter.classList.remove('is-unfolding');
      place(pulledOutRect());
    }, wait(500));

    window.setTimeout(function(){
      letter.style.transition = 'none';
      letter.classList.remove('is-floating', 'is-hiding-text');
      letter.removeAttribute('style');
      letter.style.transition = 'none';
      slot.appendChild(letter);
      letter.getBoundingClientRect();
      letter.style.transition = '';
      stage.classList.remove('is-rising');
    }, wait(1550));

    window.setTimeout(function(){
      stage.classList.add('is-closing');
      stage.classList.remove('is-opening');
    }, wait(3000));

    // Sealed again: fly away to the bottom-left, then return from the top-right 5s later.
    window.setTimeout(function(){
      envWrap.classList.remove('is-flying-in');
      envWrap.classList.add('is-flying-out');
    }, wait(4100));

    window.setTimeout(function(){
      // Envelope is off-screen now, so restoring the headline's height can't cause a visible jump.
      stage.classList.add('is-away');
      stage.classList.remove('is-closing');
    }, wait(5300));

    window.setTimeout(function(){
      envWrap.classList.remove('is-flying-out');
      envWrap.classList.add('is-flying-in');
    }, wait(5300 + 5000));

    window.setTimeout(function(){
      stage.classList.remove('is-away');
      closing = false;
      opened = false;
      btn.focus({ preventScroll:true });
    }, wait(5300 + 5000 + 1500));
  });

  window.addEventListener('resize', function(){
    if(closing || !letter.classList.contains('is-floating')) return;
    var target = finalRect();
    letter.style.transition = 'none';
    place(target);
    placeClose(target);
    placeHint(target);
    letter.getBoundingClientRect();
    letter.style.transition = '';
  });

  // Dismiss the scroll cue as soon as the reader starts moving through the letter.
  letter.addEventListener('scroll', function(){
    if(!scrollHint.classList.contains('is-visible')) return;
    if(letter.scrollTop > 60 || letter.scrollTop + letter.clientHeight >= letter.scrollHeight - 12){
      scrollHint.classList.remove('is-visible');
    }
  });

  // Floating particles
  var field = document.getElementById('particles');
  var count = window.innerWidth < 600 ? 10 : 18;
  if(!reduced){
    for(var i=0;i<count;i++){
      var p = document.createElement('span');
      p.className = 'particle';
      var left = Math.random()*100;
      var size = 3 + Math.random()*5;
      var duration = 10 + Math.random()*14;
      var delay = Math.random()*-duration;
      var drift = (Math.random()*60-30) + 'px';
      p.style.left = left + '%';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.setProperty('--drift', drift);
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      field.appendChild(p);
    }
  }

  // Background music toggle
  var musicBtn = document.getElementById('musicToggle');
  var bgm = document.getElementById('bgm');
  var playing = false;

  function hasMusic(){ return !!(bgm.querySelector('source') || bgm.currentSrc); }

  musicBtn.addEventListener('click', function(){
    var dict = I18N[currentLang];
    if(!hasMusic()){
      musicBtn.setAttribute('aria-label', dict.musicNone);
      musicBtn.setAttribute('title', dict.musicNone);
      return;
    }
    if(playing){
      bgm.pause();
      playing = false;
    } else {
      pauseReading();               // never let two tracks play at once
      bgm.play().catch(function(){});
      playing = true;
    }
    musicBtn.classList.toggle('playing', playing);
    musicBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', playing ? dict.musicPause : dict.musicPlay);
    musicBtn.setAttribute('title', playing ? dict.musicPause : dict.musicPlay);
  });

  /* ---------- Language switching: 中文 / Bahasa Melayu / English / தமிழ் ----------
     Every translatable node carries data-i18n="<key>"; applyLang() swaps the text,
     the <html lang> attribute, the page title and the music button's labels, then
     re-fits the letter if it happens to be open (translations have different lengths). */
  var I18N = {
    zh: {
      lang:'zh-CN',
      title:'致所有教过的老师 · 2024—2026 毕业感谢信',
      headline:'献给所有教过我们的老师',
      letterTitle:'致所有教过的老师',
      letterSub:'谢谢您们，陪我们走过 2024—2026',
      sign:'2024—2026年，您们的学生，敬上。',
      cta:'点击开启老师们的感谢信',
      close:'关闭该信封',
      scrollHint:'向下滑动，读完这封信',
      readLabel:'朗读这封信', readPause:'暂停朗读', readNoAudio:'此语言暂无语音',
      noticeTitle:'温馨提醒',
      noticeBody:'本音频由人工智能（AI）生成，配音内容、发音或停顿可能与原文略有差异。如有任何出入，请以原始文字内容为准。感谢您的理解与配合。',
      noticeSkip:'不再显示此提醒',
      noticeCancel:'取消', noticeOk:'我明白了，开始播放',
      musicPlay:'播放背景音乐', musicPause:'暂停背景音乐', musicNone:'未配置背景音乐',
      body:[
        '亲爱的老师们：',
        '展信安。',
        '写下这封信的时候，心里有很多话想说，却又不知道该从哪里开始。回想起初一到初三的这段时光，真的值得我们细细品味。原来，三年的时间可以过得这么快，快到我们还没来得及好好珍惜，就已经走到了初中生活的尾声。',
        '当我们觉得时间还很多的时候，一转眼才发现，留给我们的时间已经不多了。曾经以为每天都会重复的上课、下课、被老师提醒、和同学打闹的日子，如今再回头看，竟然成了我们最舍不得的回忆。',
        '初一的时候，我们还是大家口中的“小天使”。那时的我们懂礼貌，会主动向老师问好，也懂得尊重老师，因此得到了不少老师的称赞。那时候的我们，或许还带着一点青涩，对接下来的中学生活充满期待，也还没有完全展现出真正的“实力”。',
        '然而，随着时间慢慢过去，我们似乎也开始变了。',
        '到了初二，我们逐渐从“小天使”变成了“魔丸”。上课时偶尔冒出来的奇怪发言、让老师哭笑不得的行为，还有各种层出不穷的小插曲，都让我们的班级越来越热闹。到了初三，更是彻底放飞自我，仿佛把初一时积攒下来的活力一次过释放出来。上课吃东西、大吵大闹，整个教室有时简直宛如孙悟空大闹天宫。回想起来，我们真的很佩服老师们，竟然能够陪着这样一群越来越调皮的学生走过三年。',
        '三年里，人来人往，身边的面孔不断改变，但属于我们这个班的故事，从来没有停止过。有新同学加入，也有同学离开；有新老师走进我们的课堂，也有曾经教过我们的老师离开了学校。即使有些老师后来不再陪伴我们上课，有些面孔也渐渐只能留在回忆里，但您们曾经教过我们的事实，却不会因为时间过去而改变。无论您们陪伴我们的时间是长是短，都已经成为我们中学生活的一部分。',
        '说起我们班的回忆，真的有太多太多值得拿出来讲的事情了。',
        '还记得从初一到初二，有位女生总是重复着那句：“老师，我要吃鸡腿！老师，我要吃鸡腿！”现在想起来，这句话简直成了我们班独特的回忆之一。也许当时只是随口说说，但正是这些看似平凡、甚至有点莫名其妙的小事，才让我们的校园生活变得如此有趣。',
        '还有我们的义卖会。为了这次活动，大家都做了不少准备。那段时间里，我们为了共同的目标一起忙碌，也一起完成了属于班级的任务。回想起来，义卖会不只是一场活动，更是我们一起努力、一起合作的证明。也许当时的我们只顾着把事情做好，却没有意识到，这些共同经历的时刻，将来都会成为值得回味的青春片段。',
        '当然，我们班也不是每一天都这么有秩序。',
        '初二的历史课上，曾经有人把历史老师气得当场生气。现在回头想想，我们确实有时候太爱闹了，常常顾着自己的开心，却忘了老师也需要维持课堂秩序，也有自己的情绪。可是，即使我们偶尔让历史老师头疼，老师还是一次又一次地包容我们、耐心地教导我们。谢谢您没有因为我们的调皮就轻易放弃我们，也谢谢您在生气之后，依然愿意继续教我们。',
        '而到了初三，我们的调皮程度似乎又上升了一个层次。',
        '下课铃声一响，我们班的教室就仿佛变成了另一个世界。大家常常不约而同地聚集到老师的桌子旁边，一个接一个地围在那里，有的坐下来，有的拿出食物，大家就这样聚在一起吃东西、聊天、说说笑笑。明明老师本人并不在那里，坐在老师桌子旁边的却是我们这些学生，甚至还直接在老师的桌子上吃东西。',
        '远远看过去，那阵仗简直像是在召开什么重要的大会议。每个人都仿佛有自己的意见要发表，有自己的事情要讨论，大家围成一团，热闹得不得了。明明只是下课时间，明明只是聚在一起吃东西，却硬是弄出了全班代表齐聚一堂、商讨重大事情的气势。',
        '而这也正是我们班被称为“联合国”的原因。到了初三，许多其他班的同学也会直接走进我们的课室，加入这场热闹的“会议”。原本只是属于我们班的空间，却因为这些来来往往的同学，变成了一个小小的“联合国”。有时候看着大家聚在老师桌边吃东西、聊天、打闹，真的很像一场永远开不完的大会议。',
        '那张老师的桌子，原本是老师上课时使用的地方，到了我们班，却仿佛变成了“联合国会议厅”。而我们这些学生，就是每天准时出席会议的代表。也许当时的我们只是觉得这样聚在一起很有趣，但如今想起来，那些围在一起吃东西、聊天、打闹的时光，反而成了初三生活里特别鲜明的一部分。',
        '从初二到初三，其他班甚至还给我们班取了一个特别的称号——“冷笑话开源地”。也不知道到底是谁贡献了那么多冷笑话，让我们获得了这样的名声，但既然这个称号都传出去了，看来我们班确实有自己的“幽默实力”。',
        '还有那位声音特别响亮的女生，每次一开口，音量都夸张得仿佛快要震碎大家的耳膜。每当这样的场面发生时，整个班级总会多出一些令人哭笑不得的瞬间。现在回想起来，这些吵吵闹闹的画面，竟然也成了我们舍不得的一部分。',
        '还有一个星期五，至今想起来，似乎都能感受到当时的疯狂。',
        '因为隔天就是星期六，终于可以休息了，大家一到放学前就兴奋得不得了。教室里大喊大叫，有人甚至把东西丢来丢去，整个班级乱成一团。那一刻，大家仿佛已经迫不及待地想冲出校园，迎接属于自己的休息时间。现在想想，我们对放假的期待真的可以有这么夸张，而老师们在这样的日子里，还得努力维持课堂秩序，实在辛苦了。',
        '说到这里，我们也不得不特别感谢数学老师。',
        '数学老师，谢谢您一直以来对我们的耐心与包容。我们知道，我们并不是每次都让您省心。有时候，即使您已经被我们气到了，您还是会继续站在讲台上，认真地教课、解释题目，希望我们能够听懂、学会。',
        '可是，有一件事，直到现在回想起来，我们还是会觉得有些难过。',
        '那一次，一位女生和数学老师发生了冲突。老师说一句，她便顶一句，双方的话语一句接着一句，气氛也越来越紧张。或许当时的我们并没有真正意识到事情的严重性，也可能只是站在旁边看着，却没有想到，这场争执会让老师难过到这样的程度。',
        '最后，老师真的忍不住哭了。',
        '当老师生气地关上门离开时，原本吵吵闹闹的教室，突然变得寂静无声。前一刻还热热闹闹的我们，仿佛一下子失去了声音。那一瞬间，大家才慢慢意识到，事情已经不再只是平常的拌嘴，也不再只是一次普通的课堂冲突。',
        '原来，那个平时一直站在讲台上教我们数学、耐心地为我们解释题目的老师，也会因为我们的言语和行为而感到委屈，也会有承受不住的时候。',
        '当时，有两位男生和三位女生先意识到老师是真的难过了。后来，也有同学主动走到老师身边，对老师说了一声“对不起”。',
        '也许那句道歉并不能让所有难过立刻消失，但至少，我们希望让老师知道，我们并不是不在乎您的感受。也许当时的我们还不够成熟，不懂得如何好好表达自己的情绪，也不懂得一句顶嘴、一句不经思考的话，可能会让别人难过。',
        '数学老师，对不起。',
        '对不起我们曾经有那么多不懂事的时候，对不起我们有时只顾着争辩，却忘了好好听您说话。您每天站在讲台上，努力把知识教给我们，希望我们能够学会、能够进步，可是有时候，我们却没有给您应有的尊重。',
        '谢谢您，即使曾经被我们气到难过，还是一次又一次地耐心教导我们。谢谢您没有因为那一次的冲突，就放弃继续教我们。我们知道，您不只是希望我们学会数学题，也希望我们学会尊重别人、承担责任，以及在发生冲突时，懂得好好沟通。',
        '或许当时的我们没有把这些话说出口，但现在，我们想认真地向您说一声谢谢，也想说一声对不起。',
        '希望以后当您想起我们这个班时，除了那些让您头疼的日子，也能记得我们曾经意识到自己的不懂事，曾经试着向您道歉，也曾经在成长的过程中，慢慢学会理解您的辛苦与付出。',
        '因为我们不希望，留在您记忆里的我们，只是一群曾经让您难过的学生。我们更希望，您能记得，您曾经教过一群还不够成熟、偶尔会犯错，却也正在慢慢长大的孩子。',
        '而我们也会记得，曾经有一位数学老师，即使有时候被我们气得难过，依然认真地教过我们。',
        '谢谢您，数学老师。',
        '而我们的科学老师，同时也是我们的班导，更是陪伴我们走过这三年的重要人物。',
        '每当我们闹得太过分，或者有什么事情让老师不得不认真起来时，老师总会说一句：“我们是一个班的。”',
        '这句话听起来或许很简单，但现在想想，它包含了很多意思。因为我们是一个班的，所以我们不应该只顾着自己；因为我们是一个班的，所以我们应该学会互相理解、互相包容，也应该为自己的行为负责。一个班级不可能永远没有问题，也不可能每个人都一样，但只要我们愿意站在彼此的立场想一想，就能够一起变得更好。',
        '谢谢老师在我们调皮的时候提醒我们，在我们需要被管教的时候认真对待我们，也谢谢您愿意让我们在课堂上玩游戏，让学习不只是课本、作业和考试。那些充满欢笑的课堂，让我们在忙碌的学习生活中，也拥有了一些轻松而快乐的时刻。',
        '或许多年以后，我们不一定还记得每一道做过的题目，但我们很可能还会记得那些让全班笑起来的课堂，也会记得老师那句“我们是一个班的”。',
        '也谢谢马来文老师一直以来认真地教导我们。谢谢您愿意花时间解释、指导我们，让我们在学习的过程中一点一点进步。您的认真与用心，我们都看在眼里。即使有时候我们未必能立刻做到最好，也谢谢您没有因此失去耐心，而是继续带着我们往前走。',
        '还有华文老师，谢谢您陪我们度过了那么多课堂时光。我们总是有办法让您笑起来，有时候或许连我们自己都不知道，究竟是哪一句话、哪个反应，又把您逗笑了。现在想想，能够在课堂上和老师拥有这样的互动，也是很难得的事情。',
        '谢谢您让华文课不只是学习文字与知识的地方，也留下了许多轻松、温暖的回忆。也许我们曾经在课堂上说过一些让您忍不住笑出来的话，也许我们曾经让原本普通的一堂课变得特别热闹，但这些看似平凡的小事，如今回想起来，却成了我们心里珍贵的片段。',
        '我们也想特别对初一到初三教过我们的英文老师们说一声谢谢。',
        '虽然在这三年里，我们不断更换英文老师，但每一位曾经教过我们的英文老师，都值得我们感谢。谢谢您们曾经教导过我们，也谢谢您们在这段时间里的付出。',
        '尤其是到了初三，英文课的课堂秩序变得非常混乱。有时候，甚至有些同学不听老师所说的话，还会在课堂上当众大吵大闹。现在回想起来，我们知道自己有时候确实做得不够好，也可能曾经让英文老师感到无奈和头疼。',
        '无论这三年里教我们的英文老师换了多少位，我们都想借这个机会，对每一位曾经教过我们的英文老师说一声谢谢。谢谢您们曾经走进我们的课堂，教导过我们，也谢谢您们为我们付出的时间与心血。虽然有些老师可能已经不再教我们，但您们曾经教过我们的事实，我们依然会记得。',
        '当然，还有许多其他教过我们的老师。',
        '也许您们曾经因为我们的表现而生气，也许曾经对我们感到无奈，也许有时候明明已经决定要认真管教我们，最后却还是心软了。',
        '谢谢您们愿意给我们机会，愿意包容我们的不成熟，也愿意在我们做得不够好的时候，再一次提醒我们、纠正我们。我们知道，老师的心软并不代表我们可以随意任性，而是因为您们在严格要求我们的同时，也仍然关心着我们。',
        '谢谢您们愿意在我们犯错之后，继续相信我们能够学会成长。',
        '现在回想起来，我们三年的生活里，似乎总是少不了吵闹、笑声、玩笑和偶尔让老师头疼的时刻。我们有时候太兴奋，有时候不够懂事，有时候甚至忘了老师也是需要被理解和尊重的人。',
        '可是，正是因为有您们的教导与包容，我们才能在一次又一次的经历中慢慢成长。',
        '或许，我们未必能够记住每一堂课的内容，也未必能够把每一次考试都考好；或许，我们曾经让您们失望，也曾经让您们操心。但请相信，您们花在我们身上的时间与心血，并不是毫无意义的。',
        '因为除了课本上的知识，您们也教会了我们如何与人相处，如何面对错误，如何为自己的行为负责，如何在一个集体里学会理解与包容。',
        '那些当时觉得平常的提醒，那些曾经听了觉得烦的唠叨，甚至那些让我们害怕的训话，到了今天，都逐渐有了不一样的意义。',
        '老师们，写到这里，我们才发现，三年真的很短。',
        '短到我们还没来得及把每一天都记清楚，就已经走到了初中生活的尾声。曾经每天见面的老师，曾经习以为常的教室，曾经觉得永远不会结束的上课与下课，如今都开始有了不一样的意义。',
        '想到这里，真的会有一点舍不得。',
        '舍不得那些熟悉的声音，舍不得那些吵闹的日常，也舍不得那些曾经被我们视为理所当然的陪伴。',
        '原来，青春并不只是那些轰轰烈烈的大事。更多时候，它是一群人一起度过的平凡日子，是老师在讲台上教书的身影，是课室里此起彼落的笑声，也是那些当时没有特别在意、如今却想好好珍惜的瞬间。',
        '其实，我们知道，升上高一以后，我们还是有机会在学校里见到您们。',
        '我们可能还是会在走廊上遇见您们，经过您们的课室时向您们问好，偶尔停下来和您们说几句话。也许下一次见面时，我们依然会笑着和您们打招呼，甚至还会像以前一样开玩笑。',
        '所以，这并不是一封永别的信。',
        '我们只是想趁着初中三年的故事还没有完全成为过去，认真地告诉您们：谢谢您们。',
        '因为以后即使还能见面，也不代表我们还能像以前一样，每天理所当然地待在同一间课室里，听您们讲课，被您们提醒，在下课时吵吵闹闹，然后第二天又若无其事地回到教室。',
        '以后，我们可能还会经过同一条走廊，看见同样的身影，却已经不再是当年坐在您们课堂里的那个班级了。',
        '也许某一天，您们走进教室，看见新一届的学生坐在我们的座位上；也许某一天，您们又遇到一个调皮的班级，忍不住想起以前的我们。',
        '不知道那时候，您们还会不会想起，曾经有一个班级，初一时像“小天使”，初二时慢慢变成“魔丸”，到了初三，更是吵得让人哭笑不得。',
        '您们会不会想起那个总是喊着要吃鸡腿的女生？',
        '会不会想起那个被其他班称为“冷笑话开源地”的班级？',
        '会不会想起下课时挤满老师桌子旁边的学生，仿佛每天都在召开一场重要的“联合国会议”？',
        '会不会想起那个因为终于可以休息，而在星期五放学前疯狂大喊大叫的班级？',
        '又或者，会不会想起某一堂课，自己明明已经被我们气得不轻，却还是忍住情绪，继续站在讲台上，把该教的内容认真教完？',
        '老师们，也许您们教过很多届学生，见过许多不同的班级。对您们来说，我们可能只是教学生涯中的其中一届；三年以后，还会有新的学生走进教室，新的故事继续发生。',
        '可是，对我们来说，您们却是我们初中三年里，真实存在过、陪伴过我们的人。',
        '您们看着我们从初一慢慢长大，经历初二的变化，再走到初三。您们见过我们最有礼貌的样子，也见过我们最调皮、最不让人省心的样子。您们可能曾经对我们失望，也曾经因为我们的进步而欣慰。',
        '这些事情对您们来说，也许只是每天的工作；但对我们来说，却是再也无法原样重来的一段时光。',
        '我们并不是想让您们觉得我们有多么优秀，也不是想让您们忘记我们曾经犯过的错。',
        '我们只是希望，很多年以后，当您们偶尔想起2024年至2026年时，能够记得曾经教过这样一个班级。',
        '一个不算完美，却有着许多故事的班级。',
        '一个会让您们生气、让您们无奈，却也会在发现您们难过时感到心疼的班级。',
        '一个可能没有让您们每一天都感到骄傲，却真心感谢过您们的班级。',
        '我们也许不是每次都能达到您们的期待，也未必能让每一位老师都为我们的成绩感到骄傲，但我们希望，当您们以后回想起这段日子时，能够知道，您们在我们心里的位置，从来不会因为成绩、时间，或是我们以后走得多远而改变。',
        '如果曾经有哪一次，我们的行为让您们难过了，请原谅当时还不够懂事的我们。如果曾经有哪一句提醒，我们当时没有认真听进去，也希望您们知道，我们正在慢慢长大，慢慢学着理解那些以前不明白的事情。',
        '也许现在的我们，还无法完全体会老师这份工作的辛苦；也许我们还不懂得如何把感谢说得很好听。但至少，在初中三年即将结束的时候，我们想把这份感谢，好好地交到您们手中。',
        '谢谢您们没有因为我们不够完美，就停止教导我们。',
        '谢谢您们愿意在我们犯错的时候提醒我们，在我们不懂的时候耐心解释，在我们让您们头疼的时候，仍然给我们机会。',
        '谢谢您们让我们明白，老师留给学生的，不只是课本上的知识，还有那些多年以后回想起来，依然能够让人心里一暖的瞬间。',
        '老师们，往后我们还是会在学校里见到您们。',
        '所以，下次再遇见的时候，我们可能不会说太多感人的话，可能还是会像平常一样笑着向您们问好。',
        '可是，如果有一天，您们突然想起我们，想起我们曾经坐过的座位，想起那间吵吵闹闹的课室，想起那些曾经让您们又生气又无奈的日子，希望您们也能记得，在那些吵闹的日子背后，有一群学生，其实一直都很感谢您们。',
        '我们会继续长大，继续走向自己未来的生活。',
        '而您们也会继续教导新的学生，继续站在讲台上，继续成为许多学生成长路上的老师。',
        '只是希望，在您们教过的那么多届学生之中，我们也能成为偶尔会让您们想起、想起时会忍不住笑一下的那一届。',
        '谢谢您们，陪我们走过2024年至2026年。',
        '这三年，我们一起经历过的事情，可能不是什么惊天动地的大事，却是只属于我们这个班、只属于您们与我们的回忆。',
        '我们很庆幸，曾经成为您们的学生。',
        '也很庆幸，在我们还不够懂事、还不够成熟的时候，遇见了愿意耐心教导我们的您们。',
        '我们虽然不是您们最出色的学生，但您们却是我们最尊敬的老师。',
        '往后余生，愿您们开心快乐，平安健康。',
        '愿您们往后的每一天，都少一些疲惫，多一些欢笑；愿您们曾经为学生付出的耐心与关爱，也能在生活中得到温柔的回应。',
        '也希望当您们有一天想起我们这个班时，想起的不是我们曾经有多吵、多调皮，而是想起那些一起度过的日子，想起我们曾经在您的课堂里成长过。',
        '谢谢您们，老师。',
        '这一次，我们想认真地说。',
        '我们没有要和您们永别。我们只是想在离开初中的时候，好好地告诉您们：能够成为您们的学生，是我们青春里很值得珍惜的一件事。'
      ]
    },
